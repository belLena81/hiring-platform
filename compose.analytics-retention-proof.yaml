services:
  mongodb:
    ports: !override []
    volumes: !override
      - retention-proof-mongodb:/data/db

  kafka:
    ports: !override []
    volumes: !override
      - retention-proof-kafka:/var/lib/kafka/data

  analytics-batch:
    environment:
      MONGODB_URI: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      MONGODB_DATABASE: ${HIRING_ANALYTICS_RETENTION_PROOF_DATABASE:?Set HIRING_ANALYTICS_RETENTION_PROOF_DATABASE}
      ANALYTICS_TOPIC: ${HIRING_ANALYTICS_RETENTION_PROOF_TOPIC:?Set HIRING_ANALYTICS_RETENTION_PROOF_TOPIC}
    volumes: !override
      - retention-proof-analytics:/var/lib/hiring-analytics

  analytics-erasure-worker:
    environment:
      MONGODB_URI: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      MONGODB_DATABASE: ${HIRING_ANALYTICS_RETENTION_PROOF_DATABASE:?Set HIRING_ANALYTICS_RETENTION_PROOF_DATABASE}
      ANALYTICS_TOPIC: ${HIRING_ANALYTICS_RETENTION_PROOF_TOPIC:?Set HIRING_ANALYTICS_RETENTION_PROOF_TOPIC}
    volumes: !override
      - retention-proof-analytics:/var/lib/hiring-analytics

volumes:
  retention-proof-mongodb:
  retention-proof-kafka:
  retention-proof-analytics:
