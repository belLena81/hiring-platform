http {
  host = ${?HTTP_HOST}
  port = ${?HTTP_PORT}
  admission-permits = 16
  admission-permits = ${?HTTP_ADMISSION_PERMITS}
  request-timeout-ms = 5000
  resolver-timeout-ms = 4000
  trusted-proxy-cidrs = []
}

mongo {
  uri = ${?MONGODB_URI}
  database = "hiring"
}

logging {
  mask-sensitive = true
}

auth.jwt {
  hs256-secret = ${?AUTH_JWT_HS256_SECRET}
  issuer = "hiring-platform-local"
  audience = "hiring-graphql-api"
}

auth.password-hash {
  iterations = 2
  memory-kib = 19456
  parallelism = 1
}

auth.rate-limit {
  window-seconds = 60
  attempts = 20
  max-buckets = 10000
}

kafka {
  enabled = false
  enabled = ${?KAFKA_ENABLED}
  bootstrap-servers = "127.0.0.1:9092"
  bootstrap-servers = ${?KAFKA_BOOTSTRAP_SERVERS}
  topic = "hiring.operational-events.v1"
  consumer-group = "hiring-operational-events-local"
  publisher {
    worker-id = "local-publisher"
    batch-size = 50
    lease-seconds = 30
    retry-delay-seconds = 5
    max-attempts = 10
    poll-interval-ms = 500
  }
  consumer {
    enabled = false
    enabled = ${?KAFKA_CONSUMER_ENABLED}
    receipt-ttl-days = 8
    quarantine-ttl-days = 7
  }
}

vector-search {
  enabled = false
  enabled = ${?VECTOR_SEARCH_ENABLED}

  voyage {
    api-key = ${?VOYAGE_API_KEY}
    endpoint = "https://api.voyageai.com/v1/embeddings"
    model = "voyage-4-lite"
    model = ${?VOYAGE_MODEL}
    dimension = 1024
  }

  embedding {
    version = 1
    queue-size = 128
    parallelism = 4
    timeout-ms = 5000
    retry-attempts = 3
    retry-delay-ms = 250
  }

  indexes {
    jobs = "jobs_embedding_vector"
    candidates = "candidates_embedding_vector"
    lexical = "jobs_text_search"
    ready-timeout-ms = 120000
    poll-interval-ms = 1000
  }

  num-candidates = 100
}
