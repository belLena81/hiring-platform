http {
  host = ${?HTTP_HOST}
  port = ${?HTTP_PORT}
  admission-permits = 16
  admission-permits = ${?HTTP_ADMISSION_PERMITS}
  trusted-proxy-cidrs = []
}

mongo {
  uri = ${?MONGODB_URI}
  database = "hiring"
}

logging {
  mask-sensitive = true
}

auth.jwt {
  hs256-secret = ${?AUTH_JWT_HS256_SECRET}
  issuer = "hiring-platform-local"
  audience = "hiring-graphql-api"
}

auth.rate-limit {
  window-seconds = 60
  attempts = 20
  max-buckets = 10000
}

vector-search {
  enabled = false
  enabled = ${?VECTOR_SEARCH_ENABLED}

  voyage {
    api-key = ${?VOYAGE_API_KEY}
    endpoint = "https://api.voyageai.com/v1/embeddings"
    model = "voyage-4-lite"
    model = ${?VOYAGE_MODEL}
    dimension = 1024
  }

  embedding {
    version = 1
    queue-size = 128
    parallelism = 4
    timeout-ms = 5000
  }

  indexes {
    jobs = "jobs_embedding_vector"
    candidates = "candidates_embedding_vector"
    lexical = "jobs_text_search"
    ready-timeout-ms = 120000
    poll-interval-ms = 1000
  }

  num-candidates = 100
}
