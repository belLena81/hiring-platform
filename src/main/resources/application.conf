http {
  host = ${?HTTP_HOST}
  port = ${?HTTP_PORT}
}

mongo {
  uri = ${?MONGODB_URI}
  database = "hiring"
}

logging {
  level = "INFO"
  level = ${?LOG_LEVEL}
  mask-sensitive = true
  request-payloads = false
}

auth.jwt {
  hs256-secret = ${?AUTH_JWT_HS256_SECRET}
  issuer = "hiring-platform-local"
  audience = "hiring-graphql-api"
}

vector-search {
  enabled = false
  enabled = ${?VECTOR_SEARCH_ENABLED}

  voyage {
    api-key = ${?VOYAGE_API_KEY}
    endpoint = "https://api.voyageai.com/v1/embeddings"
    model = "voyage-4-lite"
    model = ${?VOYAGE_MODEL}
    dimension = 1024
  }

  embedding {
    version = 1
    queue-size = 128
    parallelism = 4
    timeout-ms = 5000
  }

  indexes {
    jobs = "jobs_embedding_vector"
    candidates = "candidates_embedding_vector"
  }

  num-candidates = 100
}
