http {
  host = ${?HTTP_HOST}
  port = ${?HTTP_PORT}
  admission-permits = 16
  admission-permits = ${?HTTP_ADMISSION_PERMITS}
  request-timeout-ms = 5000
  request-timeout-ms = ${?HTTP_REQUEST_TIMEOUT_MS}
  trusted-proxy-cidrs = []
}

mongo {
  uri = ${?MONGODB_URI}
  database = "hiring"
  reset-on-start = false
  reset-on-start = ${?MONGODB_RESET_ON_START}
}

logging {
  mask-sensitive = true
}

auth.jwt {
  hs256-secret = ${?AUTH_JWT_HS256_SECRET}
  receipt-fingerprint-secret = ${?AUTH_RECEIPT_FP_SECRET}
  issuer = "hiring-platform-local"
  audience = "hiring-graphql-api"
  cursor-ttl-seconds = 900
}

auth.admin-seed {
  enabled = false
  enabled = ${?ADMIN_SEED_ENABLED}
  name = ${?ADMIN_SEED_NAME}
  password = ${?ADMIN_SEED_PASSWORD}
}

auth.password-hash {
  iterations = 2
  memory-kib = 19456
  parallelism = 1
}

# Login and sign-up attempts per client network. Once `max-buckets` networks are tracked, unseen ones share
# `overflow-buckets` counters instead of evicting a counted network. A shared counter can itself be exhausted, which
# limits the unseen networks that hash to it for the window; tracked networks are unaffected.
auth.rate-limit {
  window-seconds = 60
  attempts = 20
  max-buckets = 10000
  overflow-buckets = 256
}

# Interview cancel and reschedule actions per authenticated actor: at most `attempts` actions per window. Once
# `max-buckets` actors are tracked, unseen actors share `overflow-buckets` counters
# (never evicting a counted actor; a shared counter can itself be exhausted for the window).
auth.interview-action-rate-limit {
  window-seconds = 60
  attempts = 30
  max-buckets = 10000
  overflow-buckets = 256
}

# Schema exposure: introspection (`__schema`, `__type`) and GET /schema.graphql. OFF by default (production). Local
# developers set GRAPHQL_SCHEMA_EXPOSURE=true or their own git-ignored local.conf; no local default is shipped.
# `__typename` is always allowed.
graphql.schema-exposure = false
graphql.schema-exposure = ${?GRAPHQL_SCHEMA_EXPOSURE}

# Persisted-query allowlist: `off` accepts any valid document; `allowlist` accepts only full documents whose lowercase
# hex SHA-256 over the exact UTF-8 `query` bytes is listed (one per line, `#` comments) in the manifest file, read once
# at startup (a missing, unreadable or empty manifest stops startup). Introspection-only documents stay governed by
# `graphql.schema-exposure`. The manifest path is a machine-local value, never committed.
graphql.persisted-queries {
  mode = "off"
  mode = ${?GRAPHQL_PERSISTED_QUERIES_MODE}
  manifest = ${?GRAPHQL_PERSISTED_QUERIES_MANIFEST}
}

# Query cost budget: GraphQL complexity (the per-query cap is 1000) charged per authenticated actor, or per client
# network when anonymous, before execution; `max-cost` per window, then HTTP 429 RATE_LIMITED with retryAfter.
# Actors and anonymous clients have separate capacity. When a cache is full, unseen keys share `overflow-buckets`
# striped counters instead of evicting a tracked key (so none is reset). A shared counter can itself be exhausted by
# an attacker who fills the cache and then spends the overflow allowance; that limits only unseen clients for the
# window (tracked clients, authenticated actors and exhausted victims are unaffected).
graphql.cost-budget {
  window-seconds = 60
  max-cost = 10000
  max-actor-buckets = 10000
  max-client-buckets = 10000
  overflow-buckets = 256
}

# Open jobs of a deleted recruiter are closed in bounded transactions: the deletion closes at most one `page-size`
# page, and a background worker closes the rest page by page. `idle-poll-millis` is the wait when no closure is due;
# `failure-backoff-*` the worker wait after an infrastructure failure; `row-retry-*` the delay before a failing
# pending closure is retried (doubled per failed attempt up to the maximum), so one stuck row never blocks the others.
recruiter-job-closure {
  page-size = 1000
  idle-poll-millis = 1000
  failure-backoff-initial-millis = 1000
  failure-backoff-max-millis = 30000
  row-retry-initial-millis = 5000
  row-retry-max-millis = 900000
}

# `/ready` lists a component as degraded (the status code is unchanged) when a background worker made no successful
# progress for `worker-staleness-seconds`, when the oldest due operational event is older than `max-outbox-age-seconds`,
# or when the oldest pending recruiter job closure is older than `max-closure-work-age-seconds` (keep it above
# `recruiter-job-closure.row-retry-max-millis`). Alert on any non-empty `degraded` list. One `/ready` answer is shared
# for `report-cache-millis` (concurrent probes share one collection and all receive the real status).
readiness {
  worker-staleness-seconds = 60
  max-outbox-age-seconds = 300
  max-closure-work-age-seconds = 1800
  report-cache-millis = 1000
}

kafka {
  restart-max-delay-seconds = 30
  restart-max-delay-seconds = ${?HIRING_KAFKA_RESTART_MAX_DELAY_SECONDS}
  enabled = false
  enabled = ${?KAFKA_ENABLED}
  bootstrap-servers = "127.0.0.1:9092"
  bootstrap-servers = ${?KAFKA_BOOTSTRAP_SERVERS}
  sasl-security-protocol = "SASL_SSL"
  sasl-security-protocol = ${?KAFKA_SASL_SECURITY_PROTOCOL}
  topic = "hiring.operational-events"
  consumer-group = "hiring-operational-events-local"
  publisher {
    worker-id = "local-publisher"
    batch-size = 50
    lease-seconds = 30
    retry-delay-seconds = 5
    max-attempts = 10
    poll-interval-ms = 500
    sasl-username = ${?KAFKA_PUBLISHER_USERNAME}
    sasl-password = ${?KAFKA_PUBLISHER_V2_PASSWORD}
  }
  consumer {
    enabled = false
    enabled = ${?KAFKA_CONSUMER_ENABLED}
    receipt-ttl-days = 8
    partition-concurrency = 4
    quarantine-ttl-days = 7
    sasl-username = ${?KAFKA_READER_USERNAME}
    sasl-password = ${?KAFKA_READER_PASSWORD}
  }
}

vector-search {
  enabled = false
  enabled = ${?VECTOR_SEARCH_ENABLED}

  voyage {
    api-key = ${?VOYAGE_API_KEY}
    endpoint = "https://api.voyageai.com/v1/embeddings"
    model = "voyage-4-lite"
    model = ${?VOYAGE_MODEL}
    dimension = 1024
  }

  embedding {
    queue-size = 128
    parallelism = 4
    timeout-ms = 5000
    retry-attempts = 3
    retry-delay-ms = 250
    durable-retry-attempts = 8
    durable-retry-base-millis = 1000
    durable-retry-cap-millis = 300000
    worker-restart-delay-millis = 1000
  }

  indexes {
    jobs = "jobs_embedding_vector"
    candidates = "candidates_embedding_vector_match_v1"
    lexical = "jobs_text_search"
    candidate-lexical = "candidates_text_search"
    ready-timeout-ms = 120000
    poll-interval-ms = 1000
  }

  num-candidates = 100
  fusion-strategy = "applicationRrf"
  rerank {
    enabled = false
    model = "rerank-2.5-lite"
  }
}

kafka.interview {
  commands-topic = "hiring.interview-commands"
  commands-topic = ${?INTERVIEW_COMMANDS_TOPIC}
  results-topic = "hiring.interview-results"
  results-topic = ${?INTERVIEW_RESULTS_TOPIC}
  worker-group = "hiring-interview-workers"
  worker-group = ${?INTERVIEW_WORKER_GROUP}
  orchestrator-group = "hiring-interview-orchestrator"
  orchestrator-group = ${?INTERVIEW_ORCHESTRATOR_GROUP}
  enabled = false
  enabled = ${?INTERVIEW_ENABLED}
  orchestrator-username = ${?KAFKA_INTERVIEW_ORCHESTRATOR_USERNAME}
  orchestrator-password = ${?KAFKA_INTERVIEW_ORCHESTRATOR_PASSWORD}
  worker-username = ${?KAFKA_INTERVIEW_WORKER_USERNAME}
  worker-password = ${?KAFKA_INTERVIEW_WORKER_PASSWORD}
  fencer-username = ${?KAFKA_INTERVIEW_FENCER_USERNAME}
  fencer-password = ${?KAFKA_INTERVIEW_FENCER_PASSWORD}
  max-attempts = 5
  retry-base-seconds = 1
  retry-cap-seconds = 30
  provider-timeout-seconds = 10
  publication-batch-size = 16
  publication-poll-interval-ms = 1000
  publication-poll-interval-ms = ${?INTERVIEW_PUBLICATION_POLL_INTERVAL_MS}
  clock-skew-tolerance-millis = 5000
  partition-concurrency = 4
  claim-seconds = 60
  pre-commit-deadline-seconds = 300
  replay-retention-seconds = 604800
  completed-dedup-retention-seconds = 691200
  proposal-ttl-seconds = 259200
}

mongo.discovery {
  max-time-millis = 2000
  permits = 4
  max-roots = 4
  # Lexical-query facets count at most this many top text matches; valid range 1..5000.
  lexical-facet-match-limit = 1000
}

# Process-local circuit breakers for outbound dependencies. Open-ms doubles per consecutive opening up to max-open-ms.
resilience.breakers {
  # Provider timeout is 5s, so five failures in 30s means the provider is down; 10s first pause, doubling to 2 min.
  voyage {
    enabled = true
    enabled = ${?BREAKER_VOYAGE_ENABLED}
    failure-threshold = 5
    failure-threshold = ${?BREAKER_VOYAGE_FAILURE_THRESHOLD}
    window-ms = 30000
    open-ms = 10000
    max-open-ms = 120000
    half-open-probes = 1
  }
  # Read-only retrieval is cheap to probe; a few more failures tolerated, two probes.
  atlas-search {
    enabled = true
    enabled = ${?BREAKER_ATLAS_SEARCH_ENABLED}
    failure-threshold = 8
    failure-threshold = ${?BREAKER_ATLAS_SEARCH_FAILURE_THRESHOLD}
    window-ms = 20000
    open-ms = 5000
    max-open-ms = 60000
    half-open-probes = 2
  }
  # One call per outbox event on a poll loop; three send failures is already a broker outage.
  kafka-publisher {
    enabled = true
    enabled = ${?BREAKER_KAFKA_PUBLISHER_ENABLED}
    failure-threshold = 3
    failure-threshold = ${?BREAKER_KAFKA_PUBLISHER_FAILURE_THRESHOLD}
    window-ms = 30000
    open-ms = 5000
    max-open-ms = 60000
    half-open-probes = 1
  }
  # Counted only after transaction retries; high threshold and short pause keep recovery fast.
  mongo-writes {
    enabled = true
    enabled = ${?BREAKER_MONGO_WRITES_ENABLED}
    failure-threshold = 20
    failure-threshold = ${?BREAKER_MONGO_WRITES_FAILURE_THRESHOLD}
    window-ms = 10000
    open-ms = 2000
    max-open-ms = 30000
    half-open-probes = 1
  }
}
