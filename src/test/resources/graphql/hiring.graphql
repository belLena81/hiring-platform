type Application {
  id: ID!
  status: ApplicationStatus!
  createdAt: String!
  updatedAt: String!
  candidate: User
  job: Job
}

input ApplicationActionInput {
  applicationId: ID!
}

type ApplicationConnection {
  edges: [ApplicationEdge!]!
  pageInfo: PageInfo!
  errors: [PayloadError!]!
}

type ApplicationEdge {
  node: Application!
  cursor: String!
}

type ApplicationEvent {
  id: ID!
  previousStatus: ApplicationStatus
  newStatus: ApplicationStatus!
  actorId: ID!
  occurredAt: String!
  feedback: String
  reason: String
}

type ApplicationEventConnection {
  edges: [ApplicationEventEdge!]!
  pageInfo: PageInfo!
  errors: [PayloadError!]!
}

type ApplicationEventEdge {
  node: ApplicationEvent!
  cursor: String!
}

type ApplicationPayload {
  application: Application
  errors: [PayloadError!]!
}

enum ApplicationStatus {
  Created
  Accepted
  Declined
  Interview
  Hired
  Rejected
}

type CandidateMatchCandidate {
  id: ID!
  name: String!
  profile: CandidateMatchProfile
}

type CandidateMatchProfile {
  skills: [String!]!
  experienceSummary: String
}

type CandidateProfile {
  skills: [String!]!
  experienceSummary: String
  resumeRef: String
}

input DeclineApplicationInput {
  applicationId: ID!
  reason: String
}

type Health {
  status: HealthStatus!
}

enum HealthStatus {
  UP
}

type Job {
  id: ID!
  title: String!
  description: String!
  requirements: [String!]!
  skills: [String!]!
  location: Location!
  status: JobStatus!
  createdAt: String!
  updatedAt: String!
  recruiter: User
}

input JobActionInput {
  jobId: ID!
}

type JobConnection {
  edges: [JobEdge!]!
  pageInfo: PageInfo!
  errors: [PayloadError!]!
}

type JobEdge {
  node: Job!
  cursor: String!
}

input JobFilter {
  city: String
  skills: [String!]
  createdAfter: String
}

input JobInput {
  title: String!
  description: String!
  requirements: [String!]!
  skills: [String!]!
  country: String!
  city: String
  remote: Boolean!
}

type JobPayload {
  job: Job
  errors: [PayloadError!]!
}

enum JobStatus {
  Draft
  Open
  Closed
}

type Location {
  country: String!
  city: String!
  remote: Boolean!
}

type Mutation {
  submitApplication(input: SubmitApplicationInput!): ApplicationPayload!
  createJob(input: JobInput!): JobPayload!
  updateJob(input: UpdateJobInput!): JobPayload!
  publishJob(input: JobActionInput!): JobPayload!
  closeJob(input: JobActionInput!): JobPayload!
  acceptApplication(input: ApplicationActionInput!): ApplicationPayload!
  moveApplicationToInterview(input: ApplicationActionInput!): ApplicationPayload!
  hireApplication(input: ApplicationActionInput!): ApplicationPayload!
  rejectApplication(input: RejectApplicationInput!): ApplicationPayload!
  declineApplication(input: DeclineApplicationInput!): ApplicationPayload!
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type PayloadError {
  code: String!
  message: String!
}

type Query {
  health: Health!
  readiness: Readiness!
  jobs(first: Int!, after: String, city: String, skills: [String!], createdAfter: String): JobConnection!
  semanticJobSearch(query: String!, filter: JobFilter, first: Int!): RankedJobResults!
  recommendedJobs(first: Int!): RankedJobResults!
  candidateMatches(jobId: ID!, first: Int!): RankedCandidateResults!
  job(id: ID!): Job
  myJobs(first: Int!, after: String, status: JobStatus): JobConnection!
  myApplications(first: Int!, after: String, status: ApplicationStatus): ApplicationConnection!
  jobApplications(jobId: ID!, first: Int!, after: String, status: ApplicationStatus): ApplicationConnection!
  applicationHistory(applicationId: ID!, first: Int!, after: String): ApplicationEventConnection!
}

type RankedCandidate {
  candidate: CandidateMatchCandidate!
  score: Float!
  searchMode: SearchMode!
  model: String!
  version: Int!
  searchId: ID!
}

type RankedCandidateResults {
  results: [RankedCandidate!]!
  errors: [PayloadError!]!
}

type RankedJob {
  job: Job!
  score: Float!
  searchMode: SearchMode!
  model: String!
  version: Int!
  searchId: ID!
}

type RankedJobResults {
  results: [RankedJob!]!
  errors: [PayloadError!]!
}

type Readiness {
  status: ReadinessStatus!
}

enum ReadinessStatus {
  READY
  NOT_READY
}

input RejectApplicationInput {
  applicationId: ID!
  feedback: String
}

enum SearchMode {
  FILTER
  VECTOR
  HYBRID
}

input SubmitApplicationInput {
  jobId: ID!
}

input UpdateJobInput {
  id: ID!
  patch: JobInput!
}

type User {
  id: ID!
  email: String!
  name: String!
  role: UserRole!
  profile: CandidateProfile
  createdAt: String!
}

enum UserRole {
  Candidate
  Recruiter
  Admin
}
