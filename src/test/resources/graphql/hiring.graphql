"A role-specific profile. Exactly one of candidate and recruiter must be set, and it must match the account's role."
input ProfileInput @oneOf {
  "The profile of a Candidate account."
  candidate: CandidateProfileInput

  "The profile of a Recruiter account."
  recruiter: RecruiterProfileInput
}

"Proposes a new time for a scheduled interview."
input ProposeInterviewRescheduleInput {
  "The workflow to reschedule."
  workflowId: InterviewWorkflowID!

  "The revision the caller last read; a different one is rejected."
  expectedRevision: Long!

  "The proposed start; must be in the future."
  startsAt: Instant!

  "The proposed end; must be after the start."
  endsAt: Instant!

  "Client-generated key; repeating it with the same input replays the result."
  idempotencyKey: UUID!
}

"The outcome of the mutation: Job on success, or a typed ValidationError or DomainError."
union PublishJobResult = Job | ValidationError | DomainError

"The read operations. Every operation except introspection requires authentication."
type Query {
  "An interview workflow the caller may see. Null when it does not exist or is not visible to the caller, so existence is not revealed."
  interviewWorkflow(
    "The workflow to read."
    workflowId: InterviewWorkflowID!): InterviewWorkflow

  "The calling user."
  me: User

  "Hiring analytics for a period of at most 30 days. Admin only."
  analyticsReport(
    "Start of the reporting period (inclusive)."
    from: Instant!,

    "End of the reporting period; at most 30 days after the start."
    to: Instant!): AnalyticsReport!

  "Health of the search embeddings: counts only, no identifiers or content. Admin only."
  embeddingCoverage(
    "The embedding model the deployment is expected to use."
    expectedModel: String): EmbeddingCoverageReport!

  "Progress of an account deletion requested by the caller."
  accountDeletionStatus(
    "The receipt returned by deleteMyAccount."
    receiptId: DeletionReceiptID!): AccountDeletionStatus!

  "A page of users, newest first. Admin only."
  users(
    "The page size; between 1 and 100."
    first: Int!,

    "The cursor of the last item of the previous page."
    after: String,

    "Only users with this role."
    role: UserRole,

    "Only users with this status; defaults to ACTIVE."
    status: UserStatus): UserConnection!

  "A page of open jobs matching the filter, newest first. The result carries the identifier of the search."
  jobs(
    "Optional structured filters."
    filter: JobFilter,

    "The page size; between 1 and 100."
    first: Int!,

    "The cursor of the last item of the previous page."
    after: String,

    "Reuses a search identifier so repeated pages and later interactions correlate; the server issues one if absent."
    searchId: SearchID): JobSearchConnection!

  "Open jobs within a radius of a point, nearest first. Each edge carries its distance. Cost: 100 + first * (1 + cost of the selected subfields). Caps per request: total complexity at most 1000, nesting depth at most 16, `first` between 1 and 100, and a configured maximum number of expensive discovery roots (default 4). The cost is charged to the caller's cost budget; the response reports it in `extensions.cost` when the caller has its own allowance."
  nearbyJobs(
    "The point to search around."
    center: GeoPointInput!,

    "The search radius in kilometres."
    radiusKm: Float!,

    "Optional structured filters."
    filter: JobFilter,

    "The page size; between 1 and 100."
    first: Int!,

    "The cursor of the last item of the previous page."
    after: String): NearbyJobsConnection!

  "Facet counts over the open jobs that match the filter, an optional radius and an optional lexical query. Cost: 100 + cost of the selected subfields, or 100 + 25 * (1 + cost of the selected subfields) when `query` is given. Caps per request: total complexity at most 1000, nesting depth at most 16, `first` between 1 and 100, and a configured maximum number of expensive discovery roots (default 4). The cost is charged to the caller's cost budget; the response reports it in `extensions.cost` when the caller has its own allowance."
  jobDiscoveryFacets(
    "Optional lexical query the facets are computed for."
    query: String,

    "Optional structured filters."
    filter: JobFilter,

    "The point to restrict to; supplied together with radiusKm."
    center: GeoPointInput,

    "The radius in kilometres; supplied together with center."
    radiusKm: Float): JobDiscoveryFacetsResult

  "Open jobs ranked by relevance to a query. A bounded top-N list of at most `first` results: it has no pageInfo and cannot be paged. Cost: 100 + first * (1 + cost of the selected subfields). Caps per request: total complexity at most 1000, nesting depth at most 16, `first` between 1 and 100, and a configured maximum number of expensive discovery roots (default 4). The cost is charged to the caller's cost budget; the response reports it in `extensions.cost` when the caller has its own allowance."
  semanticJobSearch(
    "The free-text search query."
    query: String!,

    "Optional structured filters."
    filter: JobFilter,

    "The page size; between 1 and 100."
    first: Int!,

    "Reuses a search identifier so repeated pages and later interactions correlate; the server issues one if absent."
    searchId: SearchID): SemanticJobSearchResult

  "Open jobs ranked against the calling candidate's profile. A bounded top-N list of at most `first` results: it has no pageInfo and cannot be paged. Cost: 100 + first * (1 + cost of the selected subfields). Caps per request: total complexity at most 1000, nesting depth at most 16, `first` between 1 and 100, and a configured maximum number of expensive discovery roots (default 4). The cost is charged to the caller's cost budget; the response reports it in `extensions.cost` when the caller has its own allowance."
  recommendedJobs(
    "The page size; between 1 and 100."
    first: Int!,

    "Reuses a search identifier so repeated pages and later interactions correlate; the server issues one if absent."
    searchId: SearchID): RecommendedJobsResult

  "Candidates ranked against a job the caller owns. A bounded top-N list of at most `first` results: it has no pageInfo and cannot be paged. Cost: 100 + first * (1 + cost of the selected subfields). Caps per request: total complexity at most 1000, nesting depth at most 16, `first` between 1 and 100, and a configured maximum number of expensive discovery roots (default 4). The cost is charged to the caller's cost budget; the response reports it in `extensions.cost` when the caller has its own allowance."
  candidateMatches(
    "The job."
    jobId: JobID!,

    "Optional free-text query to rank candidates against."
    query: String,

    "Optional candidate filters."
    filter: CandidateMatchFilter,

    "The page size; between 1 and 100."
    first: Int!,

    "Reuses a search identifier so repeated pages and later interactions correlate; the server issues one if absent."
    searchId: SearchID): CandidateMatchesResult

  "A job the caller may see."
  job(
    "The job to read."
    id: JobID!): Job

  "A page of the calling recruiter's jobs, newest first."
  myJobs(
    "The page size; between 1 and 100."
    first: Int!,

    "The cursor of the last item of the previous page."
    after: String,

    "Only jobs in this status."
    status: JobStatus): JobConnection!

  "A page of the calling candidate's applications, newest first."
  myApplications(
    "The page size; between 1 and 100."
    first: Int!,

    "The cursor of the last item of the previous page."
    after: String,

    "Only applications in this status."
    status: ApplicationStatus): ApplicationConnection!

  "A page of the applications to a job the caller owns, newest first."
  jobApplications(
    "The job."
    jobId: JobID!,

    "The page size; between 1 and 100."
    first: Int!,

    "The cursor of the last item of the previous page."
    after: String,

    "Only applications in this status."
    status: ApplicationStatus): ApplicationConnection!

  "The append-only status history of an application the caller may see."
  applicationHistory(
    "The application."
    applicationId: ApplicationID!,

    "The page size; between 1 and 100."
    first: Int!,

    "The cursor of the last item of the previous page."
    after: String): ApplicationEventConnection!
}

type RankedCandidate {
  candidate: CandidateMatchCandidate!
  score: Float!
  searchMode: SearchMode!
  model: String
  searchId: SearchID!
  matchedSkills: [String!]!
  retrievalScore: Float
}

type RankedCandidateResults {
  results: [RankedCandidate!]!

  "True when the semantic ranking was unavailable and these are keyword (LEXICAL) results; their relevance is not comparable with normal results."
  degraded: Boolean!

  "Why the results are degraded (PROVIDER_UNAVAILABLE or VECTOR_SEARCH_UNAVAILABLE); null otherwise."
  degradedReason: ErrorCode
}

type RankedJob {
  job: Job!
  score: Float!
  searchMode: SearchMode!
  model: String
  searchId: SearchID!
  matchedSkills: [String!]!
  retrievalScore: Float
}

type RankedJobResults {
  results: [RankedJob!]!

  "True when the semantic ranking was unavailable and these are keyword (LEXICAL) results; their relevance is not comparable with normal results."
  degraded: Boolean!

  "Why the results are degraded (PROVIDER_UNAVAILABLE or VECTOR_SEARCH_UNAVAILABLE); null otherwise."
  degradedReason: ErrorCode
}

"The outcome of the search: RankedJobResults, or SearchUnavailable when it cannot be served now, or a typed ValidationError or DomainError. Authentication, authorization and server failures remain top-level errors that null only this field."
union RecommendedJobsResult = RankedJobResults | SearchUnavailable | ValidationError | DomainError

"Records that the caller viewed a job."
input RecordJobViewInput {
  "Client-generated key; repeating it with the same input replays the result."
  idempotencyKey: UUID!

  "Client-generated identifier of this interaction event."
  eventId: UUID!

  "The viewed job."
  jobId: JobID!

  "The search that led to the view, if any."
  searchId: SearchID
}

"The outcome of the mutation: InteractionSuccess on success, or a typed ValidationError or DomainError."
union RecordJobViewResult = InteractionSuccess | ValidationError | DomainError

"Records that the caller opened a result of a search."
input RecordSearchResultClickInput {
  "Client-generated key; repeating it with the same input replays the result."
  idempotencyKey: UUID!

  "Client-generated identifier of this interaction event."
  eventId: UUID!

  "The search that produced the result."
  searchId: SearchID!

  "The identifier of the clicked result."
  resultId: UUID!
}

"The outcome of the mutation: InteractionSuccess on success, or a typed ValidationError or DomainError."
union RecordSearchResultClickResult = InteractionSuccess | ValidationError | DomainError

type RecruiterProfile {
  organizationName: String!
  jobTitle: String
}

"The profile of a recruiter."
input RecruiterProfileInput {
  "The organization the recruiter hires for."
  organizationName: String!

  "The recruiter's job title."
  jobTitle: String
}

"Rejects an application; feedback is required."
input RejectApplicationInput {
  "Client-generated key; repeating it with the same input replays the result."
  idempotencyKey: UUID!

  "The application."
  applicationId: ApplicationID!

  "Why the application was rejected; required by the rule, checked on submit."
  feedback: String
}

"The outcome of the mutation: Application on success, or a typed ValidationError or DomainError."
union RejectApplicationResult = Application | ValidationError | DomainError

"Admin repair of an interview workflow that needs attention."
input RepairInterviewInput {
  "The workflow to repair."
  workflowId: InterviewWorkflowID!

  "The revision the caller last read; a different one is rejected."
  expectedRevision: Long!

  "Client-generated key; repeating it with the same input replays the result."
  idempotencyKey: UUID!
}

"The outcome of the mutation: InterviewWorkflow on success, or a typed ValidationError or DomainError."
union RepairInterviewResult = InterviewWorkflow | ValidationError | DomainError

"Where a candidate currently lives."
input ResidenceInput {
  "The country."
  country: String!

  "The city, if known."
  city: String
}

"Schedules an interview for an accepted application."
input ScheduleInterviewInput {
  "The accepted application the interview belongs to."
  applicationId: ApplicationID!

  "When the interview starts; must be in the future."
  startsAt: Instant!

  "When the interview ends; must be after the start."
  endsAt: Instant!

  "Client-generated key; repeating it with the same input replays the result."
  idempotencyKey: UUID!
}

"The outcome of the mutation: InterviewWorkflow on success, or a typed ValidationError or DomainError."
union ScheduleInterviewResult = InterviewWorkflow | ValidationError | DomainError

"The identifier of one search, issued by the server or supplied by the client to correlate later interactions."
scalar SearchID

"How a ranked result was found."
enum SearchMode {
  "Structured filters only."
  FILTER

  "Semantic (embedding) similarity only."
  VECTOR

  "Lexical and semantic results combined."
  HYBRID

  "Keyword relevance only: a degraded answer while semantic search is unavailable."
  LEXICAL
}

"A search that is valid and permitted but cannot be served right now; sibling fields are unaffected."
type SearchUnavailable implements UserError {
  "The stable error code."
  code: ErrorCode!

  "A sanitized, human-readable message."
  message: String!

  "True when repeating the same request later may succeed."
  retryable: Boolean!
}

"The outcome of the search: RankedJobResults, or SearchUnavailable when it cannot be served now, or a typed ValidationError or DomainError. Authentication, authorization and server failures remain top-level errors that null only this field."
union SemanticJobSearchResult = RankedJobResults | SearchUnavailable | ValidationError | DomainError

"Creates a Candidate or Recruiter account."
input SignUpInput {
  "Client-generated key; repeating it with the same input replays the result."
  idempotencyKey: UUID!

  "The unique sign-in name."
  name: String!

  "CANDIDATE or RECRUITER; ADMIN accounts come from configuration only."
  role: UserRole!

  "The password."
  password: String!

  "The role-specific profile; required for Candidate and Recruiter."
  profile: ProfileInput
}

"The outcome of the mutation: AuthSuccess on success, or a typed ValidationError or DomainError."
union SignUpResult = AuthSuccess | ValidationError | DomainError

"Applies to an open job as the calling candidate."
input SubmitApplicationInput {
  "The open job to apply to."
  jobId: JobID!

  "Client-generated key; repeating it with the same input replays the result."
  idempotencyKey: UUID!
}

"The outcome of the mutation: Application on success, or a typed ValidationError or DomainError."
union SubmitApplicationResult = Application | ValidationError | DomainError

"A UUID in its canonical textual form."
scalar UUID

"Replaces the content of a job owned by the caller."
input UpdateJobInput {
  "Client-generated key; repeating it with the same input replays the result."
  idempotencyKey: UUID!

  "The job to update."
  id: JobID!

  "The new content; it replaces the whole previous content, not a partial patch."
  job: JobInput!
}

"The outcome of the mutation: Job on success, or a typed ValidationError or DomainError."
union UpdateJobResult = Job | ValidationError | DomainError

"Replaces the caller's profile."
input UpdateMyProfileInput {
  "Client-generated key; repeating it with the same input replays the result."
  idempotencyKey: UUID!

  "The new profile; it replaces the whole stored profile, not a partial update."
  profile: ProfileInput!
}

"The outcome of the mutation: User on success, or a typed ValidationError or DomainError."
union UpdateMyProfileResult = User | ValidationError | DomainError

type User {
  id: UserID!
  email: String
  name: String!
  role: UserRole!
  status: UserStatus!
  profile: UserProfile
  createdAt: Instant!
}

type UserConnection {
  edges: [UserEdge!]!
  pageInfo: PageInfo!
}

type UserEdge {
  node: User!
  cursor: String!
}

"A refusal returned as data instead of a top-level error."
interface UserError {
  "The stable error code."
  code: ErrorCode!

  "A sanitized, human-readable message."
  message: String!
}

"The identifier of a user."
scalar UserID

"The role-specific profile of a user: a CandidateProfile or a RecruiterProfile."
union UserProfile = CandidateProfile | RecruiterProfile

"The role of a user account."
enum UserRole {
  "Searches open jobs and applies to them."
  CANDIDATE

  "Manages owned jobs and the applications to them."
  RECRUITER

  "The singleton administrator."
  ADMIN
}

"Whether a user account is usable."
enum UserStatus {
  "The account can sign in."
  ACTIVE

  "The account was deleted."
  DELETED
}

"One or more input fields were invalid."
type ValidationError implements UserError {
  "The stable error code."
  code: ErrorCode!

  "All violated rules, joined into one message."
  message: String!

  "The GraphQL input path of the first violated rule, for example profile.candidate.residence.country or job.title; null when that rule has no input counterpart."
  field: String
}
