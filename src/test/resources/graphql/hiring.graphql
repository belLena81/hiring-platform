"The write operations. Each takes one input object and returns a union of the success type and typed errors."
type Mutation {
  "Schedules an interview for an accepted application."
  scheduleInterview(
    "The scheduling input."
    input: ScheduleInterviewInput!): ScheduleInterviewResult!

  "Repairs an interview workflow that stopped and needs attention. Admin only."
  repairInterviewWorkflow(
    "The repair input."
    input: RepairInterviewInput!): RepairInterviewResult!

  "Cancels an interview, which rejects the application. A refusal is returned as a typed DomainError; RATE_LIMITED carries retryAfterSeconds."
  cancelInterview(
    "The action input."
    input: InterviewActionInput!): InterviewActionResult!

  "The candidate flags that a different time is wanted; no slot changes. A refusal is returned as a typed DomainError; RATE_LIMITED carries retryAfterSeconds."
  requestInterviewReschedule(
    "The action input."
    input: InterviewActionInput!): InterviewActionResult!

  "A recruiter or Admin dismisses an open reschedule request. A refusal is returned as a typed DomainError; RATE_LIMITED carries retryAfterSeconds."
  dismissInterviewRescheduleRequest(
    "The action input."
    input: InterviewActionInput!): InterviewActionResult!

  "A recruiter or Admin proposes another time; it only takes effect if the candidate accepts it in time. A refusal is returned as a typed DomainError; RATE_LIMITED carries retryAfterSeconds."
  proposeInterviewReschedule(
    "The proposal input."
    input: ProposeInterviewRescheduleInput!): InterviewActionResult!

  "Withdraws the open reschedule proposal. A refusal is returned as a typed DomainError; RATE_LIMITED carries retryAfterSeconds."
  withdrawInterviewReschedule(
    "The action input."
    input: InterviewActionInput!): InterviewActionResult!

  "The candidate accepts the open proposal; the interview moves to the proposed time. A refusal is returned as a typed DomainError; RATE_LIMITED carries retryAfterSeconds."
  acceptInterviewReschedule(
    "The action input."
    input: InterviewActionInput!): InterviewActionResult!

  "The candidate declines the open proposal; the interview keeps its time. A refusal is returned as a typed DomainError; RATE_LIMITED carries retryAfterSeconds."
  declineInterviewReschedule(
    "The action input."
    input: InterviewActionInput!): InterviewActionResult!

  "Applies to an open job as the calling candidate; a second application to the same job is refused. Repeating the same idempotencyKey with the same input replays the original result."
  submitApplication(
    "The application to submit."
    input: SubmitApplicationInput!): SubmitApplicationResult!

  "Creates an open job owned by the calling recruiter. Repeating the same idempotencyKey with the same input replays the original result."
  createJob(
    "The job to create."
    input: CreateJobInput!): CreateJobResult!

  "Replaces the content of a job the caller owns. Repeating the same idempotencyKey with the same input replays the original result."
  updateJob(
    "The job update."
    input: UpdateJobInput!): UpdateJobResult!

  "Publishes a draft job the caller owns. Repeating the same idempotencyKey with the same input replays the original result."
  publishJob(
    "The job action."
    input: JobActionInput!): PublishJobResult!

  "Closes a job the caller owns; closed jobs accept no new applications. Repeating the same idempotencyKey with the same input replays the original result."
  closeJob(
    "The job action."
    input: JobActionInput!): CloseJobResult!

  "Accepts an application to a job the caller owns. Repeating the same idempotencyKey with the same input replays the original result."
  acceptApplication(
    "The application action."
    input: ApplicationActionInput!): AcceptApplicationResult!

  "Moves an application to the interview stage. Repeating the same idempotencyKey with the same input replays the original result."
  moveApplicationToInterview(
    "The application action."
    input: ApplicationActionInput!): MoveApplicationToInterviewResult!

  "Hires the candidate of an application. Repeating the same idempotencyKey with the same input replays the original result."
  hireApplication(
    "The application action."
    input: ApplicationActionInput!): HireApplicationResult!

  "Rejects an application; feedback is required. Repeating the same idempotencyKey with the same input replays the original result."
  rejectApplication(
    "The rejection."
    input: RejectApplicationInput!): RejectApplicationResult!

  "Declines an application as its candidate; a reason is required. Repeating the same idempotencyKey with the same input replays the original result."
  declineApplication(
    "The decline."
    input: DeclineApplicationInput!): DeclineApplicationResult!

  "Creates a Candidate or Recruiter account and signs it in. The caller is not authenticated, so rate-limit refusals are top-level errors with extensions.code RATE_LIMITED; expected refusals are typed errors, and availability failures (SERVICE_NOT_READY, UNAVAILABLE) are top-level errors. Repeating the same idempotencyKey with the same input replays the original result."
  signUp(
    "The account to create."
    input: SignUpInput!): SignUpResult!

  "Signs in with a name and password. The caller is not authenticated, so rate-limit refusals are top-level errors with extensions.code RATE_LIMITED; expected refusals are typed errors, and availability failures (SERVICE_NOT_READY, UNAVAILABLE) are top-level errors."
  login(
    "The credentials."
    input: LoginInput!): LoginResult!

  "Replaces the caller's whole profile; omitted optional parts are cleared. The variant must match the caller's role. Repeating the same idempotencyKey with the same input replays the original result."
  updateMyProfile(
    "The new profile."
    input: UpdateMyProfileInput!): UpdateMyProfileResult!

  "Requests deletion of the caller's account and returns a receipt to poll with accountDeletionStatus. Repeating the same idempotencyKey with the same input replays the original result."
  deleteMyAccount(
    "The deletion request."
    input: DeleteMyAccountInput!): DeleteMyAccountResult!

  "Records that the caller viewed a job. Repeating the same idempotencyKey with the same input replays the original result."
  recordJobView(
    "The view to record."
    input: RecordJobViewInput!): RecordJobViewResult!

  "Records that the caller opened a search result. Repeating the same idempotencyKey with the same input replays the original result."
  recordSearchResultClick(
    "The click to record."
    input: RecordSearchResultClickInput!): RecordSearchResultClickResult!
}

