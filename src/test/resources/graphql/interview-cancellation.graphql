mutation CancelInterview($input: InterviewActionInput!) {
  cancelInterview(input: $input) {
    ... on InterviewWorkflow { id revision progress cancelledAt }
    ... on ValidationError { code message field }
    ... on DomainError { code message retryAfterSeconds }
  }
}
mutation RequestInterviewReschedule($input: InterviewActionInput!) {
  requestInterviewReschedule(input: $input) {
    ... on InterviewWorkflow { id revision progress rescheduleRequestedAt }
    ... on ValidationError { code message field }
    ... on DomainError { code message retryAfterSeconds }
  }
}
mutation DismissInterviewRescheduleRequest($input: InterviewActionInput!) {
  dismissInterviewRescheduleRequest(input: $input) {
    ... on InterviewWorkflow { id revision progress rescheduleRequestedAt }
    ... on ValidationError { code message field }
    ... on DomainError { code message retryAfterSeconds }
  }
}
mutation ProposeInterviewReschedule($input: ProposeInterviewRescheduleInput!) {
  proposeInterviewReschedule(input: $input) {
    ... on InterviewWorkflow { id revision progress proposal { slot { startsAt endsAt } expiresAt } }
    ... on ValidationError { code message field }
    ... on DomainError { code message retryAfterSeconds }
  }
}
mutation WithdrawInterviewReschedule($input: InterviewActionInput!) {
  withdrawInterviewReschedule(input: $input) {
    ... on InterviewWorkflow { id revision progress proposal { slot { startsAt } } }
    ... on ValidationError { code message field }
    ... on DomainError { code message retryAfterSeconds }
  }
}
mutation AcceptInterviewReschedule($input: InterviewActionInput!) {
  acceptInterviewReschedule(input: $input) {
    ... on InterviewWorkflow { id revision progress pending { startsAt endsAt } }
    ... on ValidationError { code message field }
    ... on DomainError { code message retryAfterSeconds }
  }
}
mutation DeclineInterviewReschedule($input: InterviewActionInput!) {
  declineInterviewReschedule(input: $input) {
    ... on InterviewWorkflow { id revision progress proposal { slot { startsAt } } }
    ... on ValidationError { code message field }
    ... on DomainError { code message retryAfterSeconds }
  }
}
query InterviewLifecycle($workflowId: InterviewWorkflowID!) {
  interviewWorkflow(workflowId: $workflowId) {
    id applicationId slot { startsAt endsAt } revision progress notifiedParticipants
    pending { startsAt endsAt } cancelledAt
    proposal { slot { startsAt endsAt } expiresAt } rescheduleRequestedAt
  }
}
mutation InterviewActionOutcomes($action: InterviewActionInput!, $propose: ProposeInterviewRescheduleInput!) {
  cancel: cancelInterview(input: $action) { ... on InterviewWorkflow { revision } ... on DomainError { code retryAfterSeconds } }
  request: requestInterviewReschedule(input: $action) { ... on InterviewWorkflow { revision } ... on DomainError { code retryAfterSeconds } }
  dismiss: dismissInterviewRescheduleRequest(input: $action) { ... on InterviewWorkflow { revision } ... on DomainError { code retryAfterSeconds } }
  propose: proposeInterviewReschedule(input: $propose) { ... on InterviewWorkflow { revision } ... on DomainError { code retryAfterSeconds } }
  withdraw: withdrawInterviewReschedule(input: $action) { ... on InterviewWorkflow { revision } ... on DomainError { code retryAfterSeconds } }
  accept: acceptInterviewReschedule(input: $action) { ... on InterviewWorkflow { revision } ... on DomainError { code retryAfterSeconds } }
  decline: declineInterviewReschedule(input: $action) { ... on InterviewWorkflow { revision } ... on DomainError { code retryAfterSeconds } }
}
