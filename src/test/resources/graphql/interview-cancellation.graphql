query InterviewLifecycle($workflowId: InterviewWorkflowID!) {
  interviewWorkflow(workflowId: $workflowId) {
    id applicationId startsAt endsAt revision progress notifiedParticipants
    pendingStartsAt pendingEndsAt cancelledAt
    proposedStartsAt proposedEndsAt proposalExpiresAt rescheduleRequested
  }
}
mutation InterviewActionOutcomes($action: InterviewActionInput!, $propose: ProposeInterviewRescheduleInput!) {
  cancel: cancelInterview(input: $action) { ... on InterviewWorkflow { revision } ... on DomainError { code retryAfterSeconds } }
  request: requestInterviewReschedule(input: $action) { ... on InterviewWorkflow { revision } ... on DomainError { code retryAfterSeconds } }
  dismiss: dismissInterviewRescheduleRequest(input: $action) { ... on InterviewWorkflow { revision } ... on DomainError { code retryAfterSeconds } }
  propose: proposeInterviewReschedule(input: $propose) { ... on InterviewWorkflow { revision } ... on DomainError { code retryAfterSeconds } }
  withdraw: withdrawInterviewReschedule(input: $action) { ... on InterviewWorkflow { revision } ... on DomainError { code retryAfterSeconds } }
  accept: acceptInterviewReschedule(input: $action) { ... on InterviewWorkflow { revision } ... on DomainError { code retryAfterSeconds } }
  decline: declineInterviewReschedule(input: $action) { ... on InterviewWorkflow { revision } ... on DomainError { code retryAfterSeconds } }
}
