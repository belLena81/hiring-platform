mutation CancelInterview($input: InterviewActionInput!) {
  cancelInterview(input: $input) {
    ... on InterviewWorkflow { id revision progress cancelledAt }
    ... on ValidationError { code message field }
    ... on DomainError { code message retryAfterSeconds }
  }
}
