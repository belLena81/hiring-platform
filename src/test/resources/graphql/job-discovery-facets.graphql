query StructuredFacets($filter: JobFilter) {
  jobDiscoveryFacets(filter: $filter) {
    skills { value count }
    countries { value count }
    cities { value count }
    remote { value count }
    truncated
    coverage
    coverageLimit
  }
}

query LexicalQueryFacets($query: String, $filter: JobFilter, $center: GeoPointInput, $radiusKm: Float) {
  jobDiscoveryFacets(query: $query, filter: $filter, center: $center, radiusKm: $radiusKm) {
    skills { value count }
    cities { value count }
    remote { value count }
    truncated
    coverage
    coverageLimit
  }
}
