# Local rules. Thresholds, windows and the traffic floor are PROVISIONAL local values, not SLOs (no measured
# workload yet; see docs/specs/hiring-observability-resilience.md, "Alert and runbook behavior").
# HTTP expressions count only http_phase="body": the middleware also records a "headers" phase sample without a
# status code for every request, which would double the denominator and mix a second latency into the histogram.
# User traffic excludes the /health probes (classifier!="/health"): idle probes alone run at about 0.11 req/s and would
# pass the floor and dilute ratios and quantiles. Traffic floor: ratios and quantiles are evaluated only when the
# non-probe request rate over the window is at least 0.1 req/s (6 per minute). Below it the rule yields no data (does
# not fire, and is not reported as healthy). Accepted limitation: below the floor even a total 5xx outage does not fire.
groups:
  - name: hiring-api
    rules:
      - alert: HiringApiHighErrorRate
        expr: |
          (
            sum(rate(http_server_request_duration_seconds_count{http_phase="body",classifier!="/health",http_response_status_code=~"5.."}[1m]))
              / sum(rate(http_server_request_duration_seconds_count{http_phase="body",classifier!="/health"}[1m]))
          > 0.05
          )
          and
          sum(rate(http_server_request_duration_seconds_count{http_phase="body",classifier!="/health"}[1m])) >= 0.1
        for: 2m
        labels:
          severity: page
        annotations:
          summary: More than 5% of API requests returned 5xx for 2 minutes (provisional threshold; evaluated only at 0.1 non-probe req/s or more).
      - alert: HiringBacklogOldestPendingTooOld
        expr: hiring_backlog_oldest_pending_age_seconds > 300
        for: 2m
        labels:
          severity: ticket
        annotations:
          summary: Oldest pending {{ $labels.hiring_capability }} item is older than 5 minutes (provisional threshold).
      - alert: HiringBacklogUnobserved
        expr: hiring_backlog_sample_age_seconds > 60 or absent(hiring_backlog_sample_age_seconds)
        for: 2m
        labels:
          severity: ticket
        annotations:
          summary: Backlog sampling is stale or absent; backlog state is unknown, not zero.
      - alert: HiringApiSlowRequests
        expr: |
          (
            histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{http_phase="body",classifier!="/health"}[1m]))) > 0.3
          )
          and
          sum(rate(http_server_request_duration_seconds_count{http_phase="body",classifier!="/health"}[1m])) >= 0.1
        for: 2m
        labels:
          severity: ticket
        annotations:
          summary: API p95 latency above 300 ms for 2 minutes (provisional threshold; evaluated only at 0.1 non-probe req/s or more).
  # Kafka client rules. Names follow the observed conversion (dots to underscores, counters get _total; the
  # "{record}"-style annotation units add no suffix, as for hiring_backlog_pending). Every threshold below is a
  # STARTING VALUE, not an SLO: no measured Kafka workload exists yet. Send ratios are evaluated only when sends occur.
  - name: hiring-kafka
    rules:
      - alert: HiringKafkaConsumerLagHigh
        expr: min_over_time(hiring_kafka_consumer_lag[10m]) > 1000
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: Consumer group {{ $labels.hiring_consumer_group }} lags more than 1000 records on {{ $labels.messaging_destination_name }} partition {{ $labels.messaging_kafka_partition }} for 10 minutes (starting threshold).
      - alert: HiringKafkaPublisherSendFailureRatioHigh
        expr: |
          (
            sum(rate(hiring_kafka_producer_send_failures_total[5m]))
              / sum(rate(hiring_kafka_producer_send_duration_seconds_count[5m]))
          > 0.1
          )
          and
          sum(rate(hiring_kafka_producer_send_duration_seconds_count[5m])) > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: More than 10% of Kafka producer sends failed over 5 minutes (starting threshold).
      - alert: HiringKafkaProducerFenced
        expr: sum(increase(hiring_kafka_producer_send_failures_total{error_type=~"ProducerFencedException|InvalidProducerEpochException"}[15m])) >= 3
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: Repeated fenced or invalid-epoch send failures within 15 minutes; a single fence after erasure or retirement is expected. Sustained repeats suggest two publishers sharing one worker id. Thresholds are starting values.
      - alert: HiringKafkaRebalanceRateHigh
        expr: sum by (hiring_consumer_group) (rate(hiring_kafka_consumer_rebalances_total[10m])) * 60 > 5
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: Consumer group {{ $labels.hiring_consumer_group }} moves more than 5 partitions per minute (assigned plus revoked) for 10 minutes; members are flapping (starting threshold).
