groups:
  - name: hiring-api
    rules:
      - alert: HiringApiHighErrorRate
        expr: |
          sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[1m]))
            / sum(rate(http_server_request_duration_seconds_count[1m])) > 0.05
        for: 2m
        labels:
          severity: page
        annotations:
          summary: More than 5% of API requests returned 5xx for 2 minutes.
      - alert: HiringBacklogOldestPendingTooOld
        expr: hiring_backlog_oldest_pending_age_seconds > 300
        for: 2m
        labels:
          severity: ticket
        annotations:
          summary: Oldest pending {{ $labels.hiring_capability }} item is older than 5 minutes.
      - alert: HiringBacklogUnobserved
        expr: hiring_backlog_sample_age_seconds > 60 or absent(hiring_backlog_sample_age_seconds)
        for: 2m
        labels:
          severity: ticket
        annotations:
          summary: Backlog sampling is stale or absent; backlog state is unknown, not zero.
      - alert: HiringApiSlowRequests
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket[1m]))) > 0.3
        for: 2m
        labels:
          severity: ticket
        annotations:
          summary: API p95 latency above 300 ms for 2 minutes.