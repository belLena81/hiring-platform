# Local hiring stack: MongoDB replica set, SASL/SCRAM Kafka, and opt-in API and analytics profiles.
# Secrets are files in the ignored .local/config/secrets/ directory (directory 0700, files 0644, one value per file);
# containers read them from /run/secrets and the images export them as environment variables only inside the process.
# See README "Container runtime" for creating them.

x-rotated-logs: &rotated-logs
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-least-privilege: &least-privilege
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

# Images built from this repository: read-only root filesystem with an executable /tmp (JNA and Spark extract native
# libraries there; Docker mounts tmpfs noexec by default).
x-hiring-image-runtime: &hiring-image-runtime
  <<: *least-privilege
  read_only: true
  tmpfs:
    - /tmp:rw,exec,nosuid,nodev,size=512m
  logging: *rotated-logs

x-analytics-environment: &analytics-environment
  SPARK_MASTER: ${SPARK_MASTER:-local[2]}
  ANALYTICS_SPARK_LOCAL_DIRECTORY: /var/lib/hiring-analytics/spark-temp
  ANALYTICS_BOOTSTRAP_SERVERS: kafka:9092
  # Local Compose broker only: credentials are unencrypted on this private Compose network.
  ANALYTICS_KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
  ANALYTICS_KAFKA_ALLOW_PLAINTEXT: "true"
  ANALYTICS_KAFKA_SASL_MECHANISM: SCRAM-SHA-512
  ANALYTICS_KAFKA_USERNAME: analytics_reader
  ANALYTICS_KAFKA_PASSWORD_FILE: /run/secrets/kafka_reader_password
  ANALYTICS_LAKEHOUSE_ROOT: file:///var/lib/hiring-analytics/lakehouse
  ANALYTICS_TOPIC: ${ANALYTICS_TOPIC:-hiring.operational-events}
  HIRING_ANALYTICS_HMAC_SECRET_BASE64_FILE: /run/secrets/analytics_hmac_secret_base64
  HIRING_ANALYTICS_HMAC_KEY_ID: ${HIRING_ANALYTICS_HMAC_KEY_ID:-hmac-v1}
  # The previous HMAC key is supplied only during a rotation window, through compose.analytics-key-rotation.yaml.
  MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true}
  MONGODB_DATABASE: ${MONGODB_DATABASE:-hiring}

x-analytics-worker: &analytics-worker
  <<: *hiring-image-runtime
  build:
    context: .
    dockerfile: analytics/Dockerfile
    # Run as the owner of the bind-mounted .local/data/analytics; set these when your host uid/gid is not 1000.
    args:
      RUNTIME_UID: ${HIRING_HOST_UID:-1000}
      RUNTIME_GID: ${HIRING_HOST_GID:-1000}
  image: hiring-analytics:local
  depends_on:
    kafka:
      condition: service_healthy
    kafka-acl-init:
      condition: service_completed_successfully
    mongodb:
      condition: service_healthy
  secrets: [kafka_reader_password, analytics_hmac_secret_base64]
  volumes:
    - ./.local/data/analytics:/var/lib/hiring-analytics
  mem_limit: 4g
  cpus: 2
  pids_limit: 2048
  stop_grace_period: 60s

services:
  mongodb:
    image: mongo:8.0.32-noble@sha256:01354084d2ae665d2e79b79b0cdc50c2c0c98873618912d9a2c8c9cb5c3d24e6
    command: ["mongod", "--bind_ip_all", "--replSet", "rs0"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ./.local/data/mongodb:/data/db
    # The image entrypoint starts as root and drops to the mongodb user, so it keeps the default capability set.
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 1024
    logging: *rotated-logs
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "const hello = db.hello(); if (hello.isWritablePrimary) quit(0); try { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}); } catch (error) { if (error.codeName !== 'AlreadyInitialized') throw error; } quit(1);"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Opt-in Atlas-compatible MongoDB (mongot: $search, $vectorSearch, $rankFusion) for the Atlas-gated search specs.
  # Start with: docker compose --profile atlas up -d --wait atlas-local. Correctness only; same image as compose.atlas-local.yaml.
  atlas-local:
    profiles: ["atlas"]
    image: mongodb/mongodb-atlas-local:latest@sha256:3a8affee01fda1532d4083304bb6883f6fc0f1bf904c267d1785befa5391c58a
    ports:
      - "127.0.0.1:27018:27017"
    tmpfs:
      - /data/db:mode=1777
      - /data/configdb:mode=1777
      - /data/mongot:mode=1777
    mem_limit: 3g
    # Same open-file limit as compose.atlas-local.yaml: WiredTiger panicked at the default limit mid-suite.
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    logging: *rotated-logs
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.hello().isWritablePrimary ? quit(0) : quit(1)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  kafka:
    image: apache/kafka:3.9.2@sha256:05b4616e0702ef2729327705d54ad6b50ea70b271c4b730fabd2320789fb7b02
    # Builds the broker-only PLAIN JAAS settings from the broker secret file inside the container, then runs the image
    # entrypoint. Listener layout (D6): EXTERNAL (host clients) accepts SCRAM-SHA-512 only; INTERNAL (Compose network)
    # accepts SCRAM-SHA-512 for clients plus PLAIN, whose JAAS knows only the broker principal, so that principal serves
    # inter-broker traffic and the provisioning admin without a SCRAM credential at storage-format time (the image's
    # /etc/kafka/docker/run formats storage itself and offers no --add-scram hook); CONTROLLER keeps PLAIN with that
    # single principal. Client SCRAM credentials are created by kafka-acl-init.
    entrypoint: ["/opt/hiring/broker-entrypoint.sh"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:SASL_PLAINTEXT,INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT"
      KAFKA_SASL_ENABLED_MECHANISMS: "SCRAM-SHA-512,PLAIN"
      KAFKA_LISTENER_NAME_INTERNAL_SASL_ENABLED_MECHANISMS: "SCRAM-SHA-512,PLAIN"
      KAFKA_LISTENER_NAME_EXTERNAL_SASL_ENABLED_MECHANISMS: "SCRAM-SHA-512"
      KAFKA_LISTENER_NAME_CONTROLLER_SASL_ENABLED_MECHANISMS: "PLAIN"
      KAFKA_LISTENER_NAME_INTERNAL_SCRAM___SHA___512_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.scram.ScramLoginModule required;"
      KAFKA_LISTENER_NAME_EXTERNAL_SCRAM___SHA___512_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.scram.ScramLoginModule required;"
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: "PLAIN"
      KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: "PLAIN"
      KAFKA_AUTHORIZER_CLASS_NAME: "org.apache.kafka.metadata.authorizer.StandardAuthorizer"
      KAFKA_SUPER_USERS: "User:broker"
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    secrets:
      - kafka_broker_password
    ports:
      - "127.0.0.1:9092:29092"
    volumes:
      - ./.local/data/kafka:/var/lib/kafka/data
      - ./docker/kafka/broker-entrypoint.sh:/opt/hiring/broker-entrypoint.sh:ro
    <<: *least-privilege
    mem_limit: 1g
    cpus: 2
    pids_limit: 1024
    logging: *rotated-logs
    # Listener readiness without starting a JVM per probe; kafka-acl-init retries until the broker accepts requests.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9092"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  kafka-acl-init:
    image: apache/kafka:3.9.2@sha256:05b4616e0702ef2729327705d54ad6b50ea70b271c4b730fabd2320789fb7b02
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/hiring/provision-access.sh"]
    environment:
      KAFKA_TOPIC: ${KAFKA_TOPIC:-hiring.operational-events}
    secrets:
      - kafka_broker_password
      - kafka_publisher_password
      - kafka_reader_password
      - kafka_fencer_password
      - kafka_interview_orchestrator_password
      - kafka_interview_worker_password
      - kafka_interview_fencer_password
    volumes:
      - ./docker/kafka/provision-access.sh:/opt/hiring/provision-access.sh:ro
    <<: *least-privilege
    mem_limit: 512m
    logging: *rotated-logs
    restart: "no"

  # Opt-in hiring API: docker compose --profile api up -d --build api
  # Kafka publication stays disabled here: the API accepts SASL without TLS only for loopback brokers.
  api:
    profiles: ["api"]
    <<: *hiring-image-runtime
    build:
      context: .
      dockerfile: Dockerfile
    image: hiring-api:local
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      AUTH_JWT_HS256_SECRET_FILE: /run/secrets/auth_jwt_hs256_secret
      AUTH_RECEIPT_FP_SECRET_FILE: /run/secrets/auth_receipt_fp_secret
      KAFKA_ENABLED: "false"
    secrets: [auth_jwt_hs256_secret, auth_receipt_fp_secret]
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 1g
    cpus: 2
    pids_limit: 1024
    stop_grace_period: 30s

  analytics-batch:
    <<: *analytics-worker
    profiles: ["analytics"]
    environment:
      <<: *analytics-environment
      SPARK_MASTER: ${SPARK_MASTER:-local[*]}
      ANALYTICS_RUN_ID: ${ANALYTICS_RUN_ID:-}
      ANALYTICS_PARTITION: ${ANALYTICS_PARTITION:-}
      ANALYTICS_START_OFFSET: ${ANALYTICS_START_OFFSET:-}
      ANALYTICS_END_OFFSET_EXCLUSIVE: ${ANALYTICS_END_OFFSET_EXCLUSIVE:-}
    command: ["com.example.hiring.analytics.cli.HiringAnalyticsBatchMain"]

  analytics-streaming:
    <<: *analytics-worker
    profiles: ["analytics-streaming"]
    environment:
      <<: *analytics-environment
    volumes:
      - ./.local/data/analytics:/var/lib/hiring-analytics
      - ./.local/config/analytics-streaming.conf:/var/lib/hiring-analytics/config/analytics-streaming.conf:ro
    command:
      - -Dconfig.file=/var/lib/hiring-analytics/config/analytics-streaming.conf
      - com.example.hiring.analytics.cli.HiringAnalyticsStreamingMain

  analytics-erasure-worker:
    <<: *analytics-worker
    profiles: ["analytics-erasure"]
    environment:
      <<: *analytics-environment
      SPARK_MASTER: ${SPARK_MASTER:-local[*]}
      ANALYTICS_JOB: erasure-worker
      ANALYTICS_KAFKA_FENCER_USERNAME: analytics_fencer
      ANALYTICS_KAFKA_FENCER_PASSWORD_FILE: /run/secrets/kafka_fencer_password
    secrets: [kafka_reader_password, kafka_fencer_password, analytics_hmac_secret_base64]
    command: ["com.example.hiring.analytics.cli.AnalyticsErasureWorkerMain"]
    # Bounded: the worker already waits for MongoDB in-process and exits non-zero only when that wait or another
    # startup check fails, so an unbounded policy would crash-loop forever once its dependencies are gone.
    restart: on-failure:5

secrets:
  kafka_broker_password:
    file: ./.local/config/secrets/kafka_broker_password
  kafka_publisher_password:
    file: ./.local/config/secrets/kafka_publisher_password
  kafka_reader_password:
    file: ./.local/config/secrets/kafka_reader_password
  kafka_fencer_password:
    file: ./.local/config/secrets/kafka_fencer_password
  kafka_interview_orchestrator_password:
    file: ./.local/config/secrets/kafka_interview_orchestrator_password
  kafka_interview_worker_password:
    file: ./.local/config/secrets/kafka_interview_worker_password
  kafka_interview_fencer_password:
    file: ./.local/config/secrets/kafka_interview_fencer_password
  analytics_hmac_secret_base64:
    file: ./.local/config/secrets/analytics_hmac_secret_base64
  auth_jwt_hs256_secret:
    file: ./.local/config/secrets/auth_jwt_hs256_secret
  auth_receipt_fp_secret:
    file: ./.local/config/secrets/auth_receipt_fp_secret