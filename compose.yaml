services:
  mongodb:
    image: mongo:8.0.32-noble@sha256:01354084d2ae665d2e79b79b0cdc50c2c0c98873618912d9a2c8c9cb5c3d24e6
    command: ["mongod", "--bind_ip_all", "--replSet", "rs0"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ./.local/data/mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "const hello = db.hello(); if (hello.isWritablePrimary) quit(0); try { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}); } catch (error) { if (error.codeName !== 'AlreadyInitialized') throw error; } quit(1);"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  kafka:
    image: apache/kafka:3.9.2@sha256:05b4616e0702ef2729327705d54ad6b50ea70b271c4b730fabd2320789fb7b02
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:SASL_PLAINTEXT,INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT"
      KAFKA_SASL_ENABLED_MECHANISMS: "PLAIN"
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: "PLAIN"
      KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: "PLAIN"
      KAFKA_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"broker\" password=\"${KAFKA_BROKER_PASSWORD:?Set KAFKA_BROKER_PASSWORD in ignored .env}\";"
      KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"broker\" password=\"${KAFKA_BROKER_PASSWORD:?Set KAFKA_BROKER_PASSWORD in ignored .env}\" user_broker=\"${KAFKA_BROKER_PASSWORD:?Set KAFKA_BROKER_PASSWORD in ignored .env}\" user_hiring_publisher_v2=\"${KAFKA_PUBLISHER_V2_PASSWORD:?Set KAFKA_PUBLISHER_V2_PASSWORD in ignored .env}\" user_analytics_reader=\"${KAFKA_READER_PASSWORD:?Set KAFKA_READER_PASSWORD in ignored .env}\" user_analytics_fencer=\"${KAFKA_FENCER_PASSWORD:?Set KAFKA_FENCER_PASSWORD in ignored .env}\";"
      KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"broker\" password=\"${KAFKA_BROKER_PASSWORD:?Set KAFKA_BROKER_PASSWORD in ignored .env}\" user_broker=\"${KAFKA_BROKER_PASSWORD:?Set KAFKA_BROKER_PASSWORD in ignored .env}\" user_hiring_publisher_v2=\"${KAFKA_PUBLISHER_V2_PASSWORD:?Set KAFKA_PUBLISHER_V2_PASSWORD in ignored .env}\" user_analytics_reader=\"${KAFKA_READER_PASSWORD:?Set KAFKA_READER_PASSWORD in ignored .env}\" user_analytics_fencer=\"${KAFKA_FENCER_PASSWORD:?Set KAFKA_FENCER_PASSWORD in ignored .env}\";"
      KAFKA_LISTENER_NAME_CONTROLLER_PLAIN_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"broker\" password=\"${KAFKA_BROKER_PASSWORD:?Set KAFKA_BROKER_PASSWORD in ignored .env}\" user_broker=\"${KAFKA_BROKER_PASSWORD:?Set KAFKA_BROKER_PASSWORD in ignored .env}\" user_hiring_publisher_v2=\"${KAFKA_PUBLISHER_V2_PASSWORD:?Set KAFKA_PUBLISHER_V2_PASSWORD in ignored .env}\" user_analytics_reader=\"${KAFKA_READER_PASSWORD:?Set KAFKA_READER_PASSWORD in ignored .env}\" user_analytics_fencer=\"${KAFKA_FENCER_PASSWORD:?Set KAFKA_FENCER_PASSWORD in ignored .env}\";"
      KAFKA_AUTHORIZER_CLASS_NAME: "org.apache.kafka.metadata.authorizer.StandardAuthorizer"
      KAFKA_SUPER_USERS: "User:broker"
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:9092:29092"
    volumes:
      - ./.local/data/kafka:/var/lib/kafka/data

  kafka-acl-init:
    image: apache/kafka:3.9.2@sha256:05b4616e0702ef2729327705d54ad6b50ea70b271c4b730fabd2320789fb7b02
    depends_on:
      kafka:
        condition: service_started
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        trap 'rm -f /tmp/admin.properties' EXIT
        cat > /tmp/admin.properties <<EOF
        security.protocol=SASL_PLAINTEXT
        sasl.mechanism=PLAIN
        sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="broker" password="$${KAFKA_BROKER_PASSWORD}";
        EOF
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --command-config /tmp/admin.properties --create --if-not-exists --topic "$${KAFKA_TOPIC:-hiring.operational-events}" --partitions 1 --replication-factor 1 >/dev/null 2>&1; do sleep 2; done
        /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka:9092 --command-config /tmp/admin.properties --add --allow-principal User:hiring_publisher_v2 --operation WRITE --operation DESCRIBE --topic "$${KAFKA_TOPIC:-hiring.operational-events}"
        /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka:9092 --command-config /tmp/admin.properties --add --allow-principal User:hiring_publisher_v2 --operation IdempotentWrite --cluster
        /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka:9092 --command-config /tmp/admin.properties --add --allow-principal User:hiring_publisher_v2 --operation WRITE --operation DESCRIBE --transactional-id hiring-publisher- --resource-pattern-type prefixed
        /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka:9092 --command-config /tmp/admin.properties --remove --force --allow-principal User:publisher --operation WRITE --operation DESCRIBE --topic "$${KAFKA_TOPIC:-hiring.operational-events}"
        /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka:9092 --command-config /tmp/admin.properties --remove --force --allow-principal User:publisher --operation WRITE --operation DESCRIBE --topic hiring.phase6.runtime
        /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka:9092 --command-config /tmp/admin.properties --remove --force --allow-principal User:publisher --operation IdempotentWrite --cluster
        /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka:9092 --command-config /tmp/admin.properties --remove --force --allow-principal User:publisher --operation WRITE --operation DESCRIBE --transactional-id hiring-publisher- --resource-pattern-type prefixed
        /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka:9092 --command-config /tmp/admin.properties --add --allow-principal User:analytics_fencer --operation WRITE --operation DESCRIBE --transactional-id hiring-publisher- --resource-pattern-type prefixed
        /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka:9092 --command-config /tmp/admin.properties --add --allow-principal User:analytics_fencer --operation IdempotentWrite --cluster
        /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka:9092 --command-config /tmp/admin.properties --add --allow-principal User:analytics_reader --operation READ --operation DESCRIBE --topic "$${KAFKA_TOPIC:-hiring.operational-events}"
        /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka:9092 --command-config /tmp/admin.properties --add --allow-principal User:analytics_reader --operation DESCRIBE --cluster
        /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka:9092 --command-config /tmp/admin.properties --add --allow-principal User:analytics_reader --operation READ --group hiring-analytics-batch
        /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka:9092 --command-config /tmp/admin.properties --add --allow-principal User:analytics_reader --operation READ --group hiring-analytics-streaming-v1
        /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka:9092 --command-config /tmp/admin.properties --add --allow-principal User:analytics_reader --operation READ --group hiring-operational-events-local
        /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka:9092 --command-config /tmp/admin.properties --add --allow-principal User:analytics_reader --operation READ --group hiring-operational-events-integration
    environment:
      KAFKA_BROKER_PASSWORD: ${KAFKA_BROKER_PASSWORD:?Set KAFKA_BROKER_PASSWORD in ignored .env}
      KAFKA_FENCER_PASSWORD: ${KAFKA_FENCER_PASSWORD:?Set KAFKA_FENCER_PASSWORD in ignored .env}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-hiring.operational-events}
    restart: "no"

  analytics-batch:
    profiles: ["analytics"]
    build:
      context: .
      dockerfile: analytics/Dockerfile
    depends_on:
      kafka:
        condition: service_started
      kafka-acl-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    environment:
      ANALYTICS_RUN_ID: ${ANALYTICS_RUN_ID:-}
      SPARK_MASTER: ${SPARK_MASTER:-local[*]}
      ANALYTICS_SPARK_LOCAL_DIRECTORY: /var/lib/hiring-analytics/spark-temp
      ANALYTICS_BOOTSTRAP_SERVERS: kafka:9092
      # Local Compose broker only: credentials are unencrypted on this private Compose network.
      ANALYTICS_KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      ANALYTICS_KAFKA_ALLOW_PLAINTEXT: "true"
      ANALYTICS_KAFKA_USERNAME: analytics_reader
      ANALYTICS_KAFKA_PASSWORD: ${KAFKA_READER_PASSWORD:?Set KAFKA_READER_PASSWORD in ignored .env}
      ANALYTICS_LAKEHOUSE_ROOT: file:///var/lib/hiring-analytics/lakehouse
      ANALYTICS_TOPIC: ${ANALYTICS_TOPIC:-hiring.operational-events}
      ANALYTICS_PARTITION: ${ANALYTICS_PARTITION:-}
      ANALYTICS_START_OFFSET: ${ANALYTICS_START_OFFSET:-}
      ANALYTICS_END_OFFSET_EXCLUSIVE: ${ANALYTICS_END_OFFSET_EXCLUSIVE:-}
      HIRING_ANALYTICS_HMAC_SECRET_BASE64: ${HIRING_ANALYTICS_HMAC_SECRET_BASE64:-}
      HIRING_ANALYTICS_HMAC_KEY_ID: ${HIRING_ANALYTICS_HMAC_KEY_ID:-hmac-v1}
      HIRING_ANALYTICS_HMAC_PREVIOUS_KEY_ID: ${HIRING_ANALYTICS_HMAC_PREVIOUS_KEY_ID:-}
      HIRING_ANALYTICS_HMAC_PREVIOUS_SECRET_BASE64: ${HIRING_ANALYTICS_HMAC_PREVIOUS_SECRET_BASE64:-}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-hiring}
    volumes:
      - ./.local/data/analytics:/var/lib/hiring-analytics

  analytics-streaming:
    profiles: ["analytics-streaming"]
    build:
      context: .
      dockerfile: analytics/Dockerfile
    depends_on:
      kafka:
        condition: service_started
      kafka-acl-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: -Dconfig.file=/var/lib/hiring-analytics/config/analytics-streaming.conf
      SPARK_MASTER: ${SPARK_MASTER:-local[2]}
      ANALYTICS_SPARK_LOCAL_DIRECTORY: /var/lib/hiring-analytics/spark-temp
      ANALYTICS_BOOTSTRAP_SERVERS: kafka:9092
      # Local Compose broker only: credentials are unencrypted on this private Compose network.
      ANALYTICS_KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      ANALYTICS_KAFKA_ALLOW_PLAINTEXT: "true"
      ANALYTICS_KAFKA_USERNAME: analytics_reader
      ANALYTICS_KAFKA_PASSWORD: ${KAFKA_READER_PASSWORD:?Set KAFKA_READER_PASSWORD in ignored .env}
      ANALYTICS_LAKEHOUSE_ROOT: file:///var/lib/hiring-analytics/lakehouse
      ANALYTICS_TOPIC: ${ANALYTICS_TOPIC:-hiring.operational-events}
      HIRING_ANALYTICS_HMAC_SECRET_BASE64: ${HIRING_ANALYTICS_HMAC_SECRET_BASE64:?Set HIRING_ANALYTICS_HMAC_SECRET_BASE64 in ignored .env}
      HIRING_ANALYTICS_HMAC_KEY_ID: ${HIRING_ANALYTICS_HMAC_KEY_ID:-hmac-v1}
      HIRING_ANALYTICS_HMAC_PREVIOUS_KEY_ID: ${HIRING_ANALYTICS_HMAC_PREVIOUS_KEY_ID:-}
      HIRING_ANALYTICS_HMAC_PREVIOUS_SECRET_BASE64: ${HIRING_ANALYTICS_HMAC_PREVIOUS_SECRET_BASE64:-}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-hiring}
    volumes:
      - ./.local/data/analytics:/var/lib/hiring-analytics
      - ./.local/config/analytics-streaming.conf:/var/lib/hiring-analytics/config/analytics-streaming.conf:ro
    entrypoint: ["sbt"]
    command: ["runMain", "com.example.hiring.analytics.cli.HiringAnalyticsStreamingMain"]

  analytics-erasure-worker:
    profiles: ["analytics-erasure"]
    build:
      context: .
      dockerfile: analytics/Dockerfile.erasure
    depends_on:
      kafka:
        condition: service_started
      kafka-acl-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    environment:
      ANALYTICS_JOB: erasure-worker
      SPARK_MASTER: ${SPARK_MASTER:-local[*]}
      ANALYTICS_SPARK_LOCAL_DIRECTORY: /var/lib/hiring-analytics/spark-temp
      ANALYTICS_BOOTSTRAP_SERVERS: kafka:9092
      # Local Compose broker only: credentials are unencrypted on this private Compose network.
      ANALYTICS_KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      ANALYTICS_KAFKA_ALLOW_PLAINTEXT: "true"
      ANALYTICS_KAFKA_USERNAME: analytics_reader
      ANALYTICS_KAFKA_PASSWORD: ${KAFKA_READER_PASSWORD:?Set KAFKA_READER_PASSWORD in ignored .env}
      ANALYTICS_KAFKA_FENCER_USERNAME: analytics_fencer
      ANALYTICS_KAFKA_FENCER_PASSWORD: ${KAFKA_FENCER_PASSWORD:?Set KAFKA_FENCER_PASSWORD in ignored .env}
      ANALYTICS_LAKEHOUSE_ROOT: file:///var/lib/hiring-analytics/lakehouse
      ANALYTICS_TOPIC: ${ANALYTICS_TOPIC:-hiring.operational-events}
      HIRING_ANALYTICS_HMAC_SECRET_BASE64: ${HIRING_ANALYTICS_HMAC_SECRET_BASE64:?Set HIRING_ANALYTICS_HMAC_SECRET_BASE64 in ignored .env}
      HIRING_ANALYTICS_HMAC_KEY_ID: ${HIRING_ANALYTICS_HMAC_KEY_ID:-hmac-v1}
      HIRING_ANALYTICS_HMAC_PREVIOUS_KEY_ID: ${HIRING_ANALYTICS_HMAC_PREVIOUS_KEY_ID:-}
      HIRING_ANALYTICS_HMAC_PREVIOUS_SECRET_BASE64: ${HIRING_ANALYTICS_HMAC_PREVIOUS_SECRET_BASE64:-}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-hiring}
    volumes:
      - ./.local/data/analytics:/var/lib/hiring-analytics
    restart: unless-stopped
