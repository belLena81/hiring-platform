services:
  mongodb:
    image: mongo:8.0.32-noble@sha256:01354084d2ae665d2e79b79b0cdc50c2c0c98873618912d9a2c8c9cb5c3d24e6
    command: ["mongod", "--bind_ip_all", "--replSet", "rs0"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ./.local/data/mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "const hello = db.hello(); if (hello.isWritablePrimary) quit(0); try { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}); } catch (error) { if (error.codeName !== 'AlreadyInitialized') throw error; } quit(1);"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  kafka:
    image: apache/kafka:3.9.2
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://127.0.0.1:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: "168"
    volumes:
      - ./.local/data/kafka:/tmp/kafka-logs
