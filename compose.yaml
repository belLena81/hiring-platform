services:
  mongodb:
    image: mongo:8.0.32-noble@sha256:01354084d2ae665d2e79b79b0cdc50c2c0c98873618912d9a2c8c9cb5c3d24e6
    command: ["mongod", "--bind_ip_all", "--replSet", "rs0"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ./.local/data/mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "const hello = db.hello(); if (hello.isWritablePrimary) quit(0); try { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}); } catch (error) { if (error.codeName !== 'AlreadyInitialized') throw error; } quit(1);"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
