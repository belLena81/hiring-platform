analytics {
  mongo {
    uri = null
    uri = ${?MONGODB_URI}
    database = "hiring"
    database = ${?MONGODB_DATABASE}

    # Startup reachability check, run before any Spark session is built. Long-running commands (erasure worker and
    # streaming) retry it with capped exponential backoff for at most max-wait of total backoff; other commands
    # fail after one check.
    startup {
      check-timeout = 5 seconds
      check-timeout = ${?ANALYTICS_MONGO_STARTUP_CHECK_TIMEOUT}
      initial-backoff = 1 second
      initial-backoff = ${?ANALYTICS_MONGO_STARTUP_INITIAL_BACKOFF}
      max-backoff = 60 seconds
      max-backoff = ${?ANALYTICS_MONGO_STARTUP_MAX_BACKOFF}
      max-wait = 10 minutes
      max-wait = ${?ANALYTICS_MONGO_STARTUP_MAX_WAIT}
    }
  }

  spark {
    master = "local[*]"
    master = ${?SPARK_MASTER}
    local-directory = "/var/lib/hiring-analytics/spark-temp"
    local-directory = ${?ANALYTICS_SPARK_LOCAL_DIRECTORY}
  }

  kafka {
    bootstrap-servers = ${?ANALYTICS_BOOTSTRAP_SERVERS}
    username = ${?ANALYTICS_KAFKA_USERNAME}
    password = ${?ANALYTICS_KAFKA_PASSWORD}
    topic = "hiring.operational-events"
    topic = ${?ANALYTICS_TOPIC}
    security-protocol = "SASL_SSL"
    security-protocol = ${?ANALYTICS_KAFKA_SECURITY_PROTOCOL}
    allow-plaintext = false
    allow-plaintext = ${?ANALYTICS_KAFKA_ALLOW_PLAINTEXT}

    fencer {
      username = ${?ANALYTICS_KAFKA_FENCER_USERNAME}
      password = ${?ANALYTICS_KAFKA_FENCER_PASSWORD}
    }
  }

  lakehouse {
    root = ${?ANALYTICS_LAKEHOUSE_ROOT}
  }

  hmac {
    secret-base64 = ${?HIRING_ANALYTICS_HMAC_SECRET_BASE64}
    key-id = "hmac-v1"
    key-id = ${?HIRING_ANALYTICS_HMAC_KEY_ID}
    previous-key-id = ${?HIRING_ANALYTICS_HMAC_PREVIOUS_KEY_ID}
    previous-secret-base64 = ${?HIRING_ANALYTICS_HMAC_PREVIOUS_SECRET_BASE64}
  }

  batch {
    run-id = ${?ANALYTICS_RUN_ID}
    partition = ${?ANALYTICS_PARTITION}
    start-offset = ${?ANALYTICS_START_OFFSET}
    end-offset-exclusive = ${?ANALYTICS_END_OFFSET_EXCLUSIVE}
  }

  streaming {
    stream-id = "hiring-operational-events-v1"
    activation-grant-id = ${?ANALYTICS_STREAMING_GRANT_ID}
    checkpoint-location = "file:///var/lib/hiring-analytics/checkpoints/hiring-operational-events-v1"
    trigger-interval = 10 seconds
    maintenance-interval = 60 seconds
    maintenance-interval = ${?ANALYTICS_STREAMING_MAINTENANCE_INTERVAL}
    progress-retention = 7 days
    progress-retention = ${?ANALYTICS_STREAMING_PROGRESS_RETENTION}
    # How far the durable watermark trails the greatest admitted event time. A UTC day closes once its end is at or before
    # the watermark; later facts for that day go only to the late-fact dataset for explicit operator replay. Validated
    # between 1 hour and 7 days, and part of the stream identity: changing it needs a re-created grant and checkpoint.
    allowed-lateness = 24 hours
    allowed-lateness = ${?ANALYTICS_STREAMING_ALLOWED_LATENESS}
    # How often the maintenance tick compacts each subject-attributed table with OPTIMIZE.
    # AnalyticsStreamingSettings validation: 0 disables compaction; otherwise the value must be at least maintenance-interval.
    optimize-interval = 6 hours
    optimize-interval = ${?ANALYTICS_STREAMING_OPTIMIZE_INTERVAL}
    max-offsets-per-trigger = 1000
    maximum-replay-records = 1000
    # Keep empty until an operator supplies offsets; query startup must match them to Kafka partition metadata.
    initial-offsets = []
  }

  operational {
    retention {
      bronze-days = 7
      bronze-days = ${?ANALYTICS_RETENTION_BRONZE_DAYS}
      quarantine-days = 7
      quarantine-days = ${?ANALYTICS_RETENTION_QUARANTINE_DAYS}
      silver-days = 30
      silver-days = ${?ANALYTICS_RETENTION_SILVER_DAYS}
      # Application stage times: days kept after a terminal status, and days kept after the last event of an open application.
      stage-times-terminal-days = 30
      stage-times-terminal-days = ${?ANALYTICS_RETENTION_STAGE_TIMES_TERMINAL_DAYS}
      stage-times-open-days = 180
      stage-times-open-days = ${?ANALYTICS_RETENTION_STAGE_TIMES_OPEN_DAYS}
      published-snapshot-days = 30
      published-snapshot-days = ${?ANALYTICS_RETENTION_PUBLISHED_SNAPSHOT_DAYS}
      deletion-marker-days = 31
      deletion-marker-days = ${?ANALYTICS_RETENTION_DELETION_MARKER_DAYS}
      delta-vacuum-safety = 7 days
      delta-vacuum-safety = ${?ANALYTICS_RETENTION_DELTA_VACUUM_SAFETY}
      delta-log-retention = 14 days
      delta-log-retention = ${?ANALYTICS_RETENTION_DELTA_LOG_RETENTION}
      # Upper bound on purge-to-verified-erasure time; startup fails when the retention horizons exceed it.
      erasure-completion-budget = 21 days
      erasure-completion-budget = ${?ANALYTICS_RETENTION_ERASURE_COMPLETION_BUDGET}
      # Broker topic settings, used only for the budget check; the runtime gate reads real broker offsets.
      kafka-retention = 7 days
      kafka-retention = ${?ANALYTICS_RETENTION_KAFKA_RETENTION}
      kafka-segment-roll = 7 days
      kafka-segment-roll = ${?ANALYTICS_RETENTION_KAFKA_SEGMENT_ROLL}
    }
    report-reservation-ttl = 90 days
    report-reservation-ttl = ${?ANALYTICS_REPORT_RESERVATION_TTL}
    mongo-transaction-window = 120 seconds
    mongo-transaction-window = ${?ANALYTICS_MONGO_TRANSACTION_WINDOW}
    maximum-erasure-evidence-files = 100000
    maximum-erasure-evidence-files = ${?ANALYTICS_MAXIMUM_ERASURE_EVIDENCE_FILES}
    mongo-publisher-buffer-size = 256
    mongo-publisher-buffer-size = ${?ANALYTICS_MONGO_PUBLISHER_BUFFER_SIZE}
    erasure-worker {
      lease-duration = 90 seconds
      lease-duration = ${?ANALYTICS_ERASURE_LEASE_DURATION}
      delivery-timeout = 30 seconds
      delivery-timeout = ${?ANALYTICS_ERASURE_DELIVERY_TIMEOUT}
      poll-interval = 5 seconds
      poll-interval = ${?ANALYTICS_ERASURE_POLL_INTERVAL}
      reclamation-recheck-interval = 5 minutes
      reclamation-recheck-interval = ${?ANALYTICS_ERASURE_RECLAMATION_RECHECK_INTERVAL}
      # Minimum spacing of the unchanged-backlog log line; a changed backlog is logged at once.
      backlog-log-interval = 1 hour
      backlog-log-interval = ${?ANALYTICS_ERASURE_BACKLOG_LOG_INTERVAL}
    }
  }

  key-retirement-audit {
    retiring-key-id = ${?ANALYTICS_RETIRING_KEY_ID}
    kafka {
      barrier-offset = ${?ANALYTICS_RETIRING_KAFKA_BARRIER_OFFSET}
      earliest-available-offset = ${?ANALYTICS_RETIRING_KAFKA_EARLIEST_OFFSET}
      evidence-reference = ${?ANALYTICS_RETIRING_KAFKA_EVIDENCE_REFERENCE}
    }
    delta-data {
      retained-until = ${?ANALYTICS_RETIRING_DELTA_DATA_UNTIL}
      evidence-reference = ${?ANALYTICS_RETIRING_DELTA_DATA_EVIDENCE_REFERENCE}
    }
    delta-logs {
      retained-until = ${?ANALYTICS_RETIRING_DELTA_LOGS_UNTIL}
      evidence-reference = ${?ANALYTICS_RETIRING_DELTA_LOGS_EVIDENCE_REFERENCE}
    }
    reports {
      retained-until = ${?ANALYTICS_RETIRING_REPORTS_UNTIL}
      evidence-reference = ${?ANALYTICS_RETIRING_REPORTS_EVIDENCE_REFERENCE}
    }
    writers {
      observed-at = ${?ANALYTICS_RETIRING_WRITERS_OBSERVED_AT}
      coverage-reference = ${?ANALYTICS_RETIRING_WRITERS_COVERAGE_REFERENCE}
      managed = []
      unmanaged = []
    }
  }

  key-retirement-fixture {
    lakehouse-root = ${?ANALYTICS_LAKEHOUSE_ROOT}
    spark-master = ${?SPARK_MASTER}
    old-key-id = ${?HIRING_HMAC_ROTATION_OLD_KEY_ID}
    old-secret-base64 = ${?HIRING_HMAC_ROTATION_OLD_SECRET_BASE64}
    new-key-id = ${?HIRING_HMAC_ROTATION_NEW_KEY_ID}
    new-secret-base64 = ${?HIRING_HMAC_ROTATION_NEW_SECRET_BASE64}
    kafka {
      bootstrap-servers = ${?ANALYTICS_BOOTSTRAP_SERVERS}
      username = ${?ANALYTICS_KAFKA_USERNAME}
      password = ${?ANALYTICS_KAFKA_PASSWORD}
      security-protocol = ${?ANALYTICS_KAFKA_SECURITY_PROTOCOL}
      allow-plaintext = ${?ANALYTICS_KAFKA_ALLOW_PLAINTEXT}
      topic = ${?ANALYTICS_TOPIC}
    }
  }

  key-retirement-authorization {
    mongo {
      uri = ${?MONGODB_URI}
      database = ${?MONGODB_DATABASE}
    }
    spark {
      master = ${?SPARK_MASTER}
    }
    lakehouse {
      root = ${?ANALYTICS_LAKEHOUSE_ROOT}
    }
    kafka {
      bootstrap-servers = ${?ANALYTICS_BOOTSTRAP_SERVERS}
      username = ${?ANALYTICS_KAFKA_USERNAME}
      password = ${?ANALYTICS_KAFKA_PASSWORD}
      security-protocol = ${?ANALYTICS_KAFKA_SECURITY_PROTOCOL}
      allow-plaintext = ${?ANALYTICS_KAFKA_ALLOW_PLAINTEXT}
      topic = ${?ANALYTICS_TOPIC}
    }
    retiring-key-id = ${?ANALYTICS_RETIRING_KEY_ID}
    docker {
      volume-name = ${?HIRING_HMAC_ROTATION_VOLUME_NAME}
      old-image = ${?HIRING_HMAC_ROTATION_OLD_IMAGE}
      old-image-id = ${?HIRING_HMAC_ROTATION_OLD_IMAGE_ID}
      old-uid = ${?HIRING_HMAC_ROTATION_OLD_UID}
      new-image = ${?HIRING_HMAC_ROTATION_NEW_IMAGE}
      new-image-id = ${?HIRING_HMAC_ROTATION_NEW_IMAGE_ID}
      new-uid = ${?HIRING_HMAC_ROTATION_NEW_UID}
    }
  }
}
