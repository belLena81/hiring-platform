# Explicit plain-text console logging, in the format of Spark's log4j2-defaults.properties (root INFO, stderr, same
# pattern, same jetty and parquet quieting; the repl and Hive metastore loggers are left out because the analytics
# image uses neither). With a log4j2 configuration on the classpath Spark does not apply its own defaults, and its
# fallback can be the JSON layout (spark.log.structuredLogging.enabled), so keeping text here is deliberate.
# Added: MongoDB driver cluster monitoring at WARN. The driver logs an INFO line with a stack trace every second
# while no server can be selected, which buries the one sanitized WARN line per startup retry.
rootLogger.level = info
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

logger.mongoCluster.name = org.mongodb.driver.cluster
logger.mongoCluster.level = warn

logger.jetty.name = org.sparkproject.jetty
logger.jetty.level = warn
logger.jetty2.name = org.sparkproject.jetty.util.component.AbstractLifeCycle
logger.jetty2.level = error
logger.parquet.name = org.apache.parquet.CorruptStatistics
logger.parquet.level = error
logger.parquet2.name = parquet.CorruptStatistics
logger.parquet2.level = error
