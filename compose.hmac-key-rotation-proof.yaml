services:
  mongodb:
    ports: !override
      - "127.0.0.1:${HIRING_HMAC_ROTATION_MONGO_PORT:?Set the isolated Mongo port}:27017"
    volumes: !override
      - hmac-rotation-mongodb:/data/db

  kafka:
    environment:
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:${HIRING_HMAC_ROTATION_KAFKA_PORT:?Set the isolated Kafka port}"
    ports: !override
      - "127.0.0.1:${HIRING_HMAC_ROTATION_KAFKA_PORT:?Set the isolated Kafka port}:29092"
    volumes: !override
      - hmac-rotation-kafka:/var/lib/kafka/data

  analytics-batch:
    image: ${HIRING_HMAC_ROTATION_WRITER_IMAGE:?Set the isolated writer image}
    build: !reset null
    environment:
      MONGODB_URI: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      MONGODB_DATABASE: ${HIRING_HMAC_ROTATION_DATABASE:?Set the isolated Mongo database}
      ANALYTICS_TOPIC: ${HIRING_HMAC_ROTATION_TOPIC:?Set the isolated Kafka topic}
      ANALYTICS_LAKEHOUSE_ROOT: file://${HIRING_HMAC_ROTATION_DATA_DIR:?Set the isolated lakehouse directory}/lakehouse
    volumes: !override
      - hmac-rotation-analytics:${HIRING_HMAC_ROTATION_DATA_DIR:?Set the isolated lakehouse directory}

  analytics-erasure-worker:
    image: ${HIRING_HMAC_ROTATION_WRITER_IMAGE:?Set the isolated writer image}
    build: !reset null
    environment:
      MONGODB_URI: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      MONGODB_DATABASE: ${HIRING_HMAC_ROTATION_DATABASE:?Set the isolated Mongo database}
      ANALYTICS_TOPIC: ${HIRING_HMAC_ROTATION_TOPIC:?Set the isolated Kafka topic}
      ANALYTICS_LAKEHOUSE_ROOT: file://${HIRING_HMAC_ROTATION_DATA_DIR:?Set the isolated lakehouse directory}/lakehouse
    volumes: !override
      - hmac-rotation-analytics:${HIRING_HMAC_ROTATION_DATA_DIR:?Set the isolated lakehouse directory}
    restart: "no"

volumes:
  hmac-rotation-mongodb:
  hmac-rotation-kafka:
  hmac-rotation-analytics:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HIRING_HMAC_ROTATION_DATA_DIR:?Set the isolated lakehouse directory}
