# Test infrastructure only. The wrapper supplies a private, stable env file.
services:
  mongodb:
    image: mongo:8.0.32-noble@sha256:01354084d2ae665d2e79b79b0cdc50c2c0c98873618912d9a2c8c9cb5c3d24e6
    command: ["mongod", "--bind_ip_all", "--replSet", "${HIRING_TEST_REPLICA_SET:?}", "--wiredTigerCacheSizeGB", "0.25"]
    # Covers tmpfs pages plus the explicit 256MiB WiredTiger cache and process overhead.
    mem_limit: 3g
    # MongoDB recommends at least 64000 open files; migrations create many temporary index files.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:${HIRING_TEST_MONGO_PORT:?}:27017"
    tmpfs:
      # Preserve MongoDB's native 500MiB free-space reserve during migration/recovery suites.
      - /data/db:size=2g
      - /data/configdb
    labels:
      hiring.test.identity: ${HIRING_TEST_NONCE:?}
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'const h=db.hello(); if(h.isWritablePrimary) quit(0); try {rs.initiate({_id:\"${HIRING_TEST_REPLICA_SET:?}\",members:[{_id:0,host:\"localhost:27017\"}]})} catch(e) {if(e.codeName!==\"AlreadyInitialized\") throw e} quit(1)'" ]
      interval: 2s
      timeout: 3s
      retries: 45
  kafka:
    image: apache/kafka:3.9.2@sha256:05b4616e0702ef2729327705d54ad6b50ea70b271c4b730fabd2320789fb7b02
    ports:
      - "127.0.0.1:${HIRING_TEST_KAFKA_PORT:?}:29092"
    tmpfs:
      - /var/lib/kafka/data:uid=1000,gid=1000,size=512m
      - /etc/kafka/secrets:uid=1000,gid=1000,size=16m
      - /mnt/shared/config:uid=1000,gid=1000,size=16m
    labels:
      hiring.test.identity: ${HIRING_TEST_NONCE:?}
    mem_limit: 768m
    environment:
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
      CLUSTER_ID: ${HIRING_TEST_KAFKA_CLUSTER_ID:?}
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:${HIRING_TEST_KAFKA_PORT:?}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:SASL_PLAINTEXT,INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512,PLAIN
      # Client listeners authenticate with SCRAM-SHA-512 (D6). INTERNAL also accepts PLAIN for the broker principal only,
      # which serves inter-broker traffic and the initialize admin before any SCRAM credential exists; EXTERNAL is SCRAM only.
      KAFKA_LISTENER_NAME_INTERNAL_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512,PLAIN
      KAFKA_LISTENER_NAME_EXTERNAL_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      KAFKA_LISTENER_NAME_CONTROLLER_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_LISTENER_NAME_INTERNAL_SCRAM___SHA___512_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required;
      KAFKA_LISTENER_NAME_EXTERNAL_SCRAM___SHA___512_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required;
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="broker" password="${HIRING_TEST_BROKER_PASSWORD:?}" user_broker="${HIRING_TEST_BROKER_PASSWORD:?}";'
      KAFKA_LISTENER_NAME_CONTROLLER_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="broker" password="${HIRING_TEST_BROKER_PASSWORD:?}" user_broker="${HIRING_TEST_BROKER_PASSWORD:?}";'
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: User:broker
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: "1000"
      KAFKA_LOG_SEGMENT_DELETE_DELAY_MS: "1000"
  initialize:
    image: apache/kafka:3.9.2@sha256:05b4616e0702ef2729327705d54ad6b50ea70b271c4b730fabd2320789fb7b02
    tmpfs:
      - /var/lib/kafka/data:uid=1000,gid=1000,size=16m
      - /etc/kafka/secrets:uid=1000,gid=1000,size=16m
      - /mnt/shared/config:uid=1000,gid=1000,size=16m
    depends_on:
      kafka:
        condition: service_started
    environment:
      HIRING_TEST_BROKER_PASSWORD: ${HIRING_TEST_BROKER_PASSWORD:?}
      HIRING_TEST_PUBLISHER_PASSWORD: ${HIRING_TEST_PUBLISHER_PASSWORD:?}
      HIRING_TEST_READER_PASSWORD: ${HIRING_TEST_READER_PASSWORD:?}
      HIRING_TEST_FENCER_PASSWORD: ${HIRING_TEST_FENCER_PASSWORD:?}
      HIRING_TEST_ORCHESTRATOR_PASSWORD: ${HIRING_TEST_ORCHESTRATOR_PASSWORD:?}
      HIRING_TEST_WORKER_PASSWORD: ${HIRING_TEST_WORKER_PASSWORD:?}
      HIRING_TEST_INTERVIEW_FENCER_PASSWORD: ${HIRING_TEST_INTERVIEW_FENCER_PASSWORD:?}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        umask 077
        trap 'rm -f /tmp/admin.properties' EXIT
        printf 'security.protocol=SASL_PLAINTEXT\nsasl.mechanism=PLAIN\nsasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="broker" password="%s";\n' "$$HIRING_TEST_BROKER_PASSWORD" > /tmp/admin.properties
        for attempt in $$(seq 1 90); do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --command-config /tmp/admin.properties --list >/dev/null 2>&1 && break
          sleep 1
        done
        # SCRAM-SHA-512 credentials come before any ACL. The admin above logs in with PLAIN on the INTERNAL listener; the
        # broker principal also gets a SCRAM credential because host-side tests reach the EXTERNAL listener (SCRAM only).
        # The password goes through an owner-only properties file (--add-config-file), never a process argument.
        trap 'rm -f /tmp/admin.properties /tmp/scram.properties /tmp/client-plain.properties /tmp/client-plain.err' EXIT
        for pair in 'broker:HIRING_TEST_BROKER_PASSWORD' 'hiring_publisher_v2:HIRING_TEST_PUBLISHER_PASSWORD' 'analytics_reader:HIRING_TEST_READER_PASSWORD' 'analytics_fencer:HIRING_TEST_FENCER_PASSWORD' 'interview_command_publisher:HIRING_TEST_ORCHESTRATOR_PASSWORD' 'interview_result_publisher:HIRING_TEST_WORKER_PASSWORD' 'interview_fencer:HIRING_TEST_INTERVIEW_FENCER_PASSWORD'; do
          principal="$${pair%%:*}"; variable="$${pair#*:}"
          printf 'SCRAM-SHA-512=iterations=8192,password=%s\n' "$${!variable}" > /tmp/scram.properties
          /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:9092 --command-config /tmp/admin.properties --alter --entity-type users --entity-name "$$principal" --add-config-file /tmp/scram.properties >/dev/null
        done
        rm -f /tmp/scram.properties
        # KFH-06.1 on the INTERNAL listener: only the broker principal may use PLAIN there, so a client user must be refused.
        printf 'security.protocol=SASL_PLAINTEXT\nsasl.mechanism=PLAIN\nsasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="analytics_reader" password="%s";\n' "$$HIRING_TEST_READER_PASSWORD" > /tmp/client-plain.properties
        # The refusal must be an authentication failure: an unreachable broker or any other error also fails setup.
        if /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --command-config /tmp/client-plain.properties --list >/dev/null 2>/tmp/client-plain.err; then
          echo "client principal authenticated with PLAIN on the internal listener" >&2
          exit 1
        fi
        if ! grep -q -E 'SaslAuthenticationException|Authentication failed|Unsupported SASL mechanism|UnsupportedSaslMechanismException' /tmp/client-plain.err; then
          echo "PLAIN client check failed for a reason other than SASL authentication" >&2
          exit 1
        fi
        rm -f /tmp/client-plain.properties /tmp/client-plain.err
        # Exact per-case ACLs are provisioned by the test namespace fixture; no broad test data grants.
        for principal in hiring_publisher_v2 analytics_fencer interview_command_publisher interview_result_publisher interview_fencer; do
          /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka:9092 --command-config /tmp/admin.properties --add --allow-principal "User:$$principal" --operation IdempotentWrite --cluster >/dev/null
        done
        for pair in 'hiring_publisher_v2:hiring-publisher-' 'analytics_fencer:hiring-publisher-' 'interview_command_publisher:hiring-interview-orchestrator-' 'interview_result_publisher:hiring-interview-worker-' 'interview_fencer:hiring-interview-orchestrator-' 'interview_fencer:hiring-interview-worker-'; do
          principal="$${pair%%:*}"; prefix="$${pair#*:}"
          /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka:9092 --command-config /tmp/admin.properties --add --allow-principal "User:$$principal" --operation WRITE --operation DESCRIBE --transactional-id "$$prefix" --resource-pattern-type prefixed >/dev/null
        done
