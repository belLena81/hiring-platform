# Nonce-bound isolated-test action only. Production and existing real-horizon proof defaults stay unchanged.
services:
  kafka:
    environment:
      KAFKA_LOG_RETENTION_MS: "60000"
      KAFKA_LOG_SEGMENT_MS: "1000"
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: "1000"
      KAFKA_LOG_SEGMENT_DELETE_DELAY_MS: "1000"
  analytics-batch:
    environment:
      SPARK_MASTER: local[2]
      HIRING_HMAC_ROTATION_ISOLATED_TEST_NONCE: ${HIRING_HMAC_ROTATION_ISOLATED_TEST_NONCE:?Set isolated test nonce}
      ANALYTICS_RETENTION_DELTA_VACUUM_SAFETY: 60 seconds
      ANALYTICS_RETENTION_DELTA_LOG_RETENTION: 60 seconds
      ANALYTICS_SPARK_LOCAL_DIRECTORY: /var/lib/hiring-analytics/spark-temp
    volumes: !override
      - hmac-rotation-analytics:${HIRING_HMAC_ROTATION_DATA_DIR:?Set isolated fixture directory}
      - hmac-rotation-analytics:/var/lib/hiring-analytics
  analytics-erasure-worker:
    environment:
      SPARK_MASTER: local[2]
      ANALYTICS_RETENTION_DELTA_VACUUM_SAFETY: 60 seconds
      ANALYTICS_RETENTION_DELTA_LOG_RETENTION: 60 seconds
      ANALYTICS_SPARK_LOCAL_DIRECTORY: /var/lib/hiring-analytics/spark-temp
    volumes: !override
      - hmac-rotation-analytics:${HIRING_HMAC_ROTATION_DATA_DIR:?Set isolated fixture directory}
      - hmac-rotation-analytics:/var/lib/hiring-analytics
