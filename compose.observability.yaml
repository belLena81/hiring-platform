# Local observability overlay: OTLP collector -> Prometheus -> Grafana, with the API exporting HTTP metrics.
#   docker compose -f compose.yaml -f compose.observability.yaml --profile api up -d --build
# Grafana: http://127.0.0.1:3000 (login admin / $GRAFANA_ADMIN_PASSWORD, default admin; local only; not for production). Prometheus: http://127.0.0.1:9090.
# Metrics -> Prometheus, traces -> Tempo, api container logs -> Loki (via Alloy). Tempo/Loki data is ephemeral (tmpfs).
services:
  api:
    environment:
      OTEL_SERVICE_NAME: hiring-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: otlp
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
      # Sampling and exporter bounds (policy: docs/specs/hiring-observability-resilience.md, "Sampling/bounds").
      # Local values, provisional until the overhead baseline (HOR-10); not production settings.
      OTEL_TRACES_SAMPLER: parentbased_always_on        # 100% of root spans locally; honors an incoming sampling decision
      OTEL_BSP_MAX_QUEUE_SIZE: "2048"                   # spans buffered; a full queue drops new spans, never blocks a request
      OTEL_BSP_MAX_EXPORT_BATCH_SIZE: "512"             # must be <= queue size
      OTEL_BSP_SCHEDULE_DELAY: "2000"                   # ms between span batch exports
      OTEL_BSP_EXPORT_TIMEOUT: "10000"                  # ms before one span batch export is abandoned (its spans are lost)
      OTEL_EXPORTER_OTLP_TIMEOUT: "10000"               # ms per OTLP request (traces and metrics)
    depends_on:
      otel-collector:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1@sha256:d0ebf65280da2e1b1491d1b93648281afd353d4b9ea19160090303cec9a233bd
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./docker/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    mem_limit: 256m
    depends_on: [tempo]
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.7.1@sha256:4443be217c396b065ee34845534199c36fdba4dc619cb96550e228d73fba6e69
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./docker/observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
    tmpfs:
      - /var/tempo:mode=1777,size=512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2@sha256:8af2de1abbdd7aa92b27c9bcc96f0f4140c9096b507c77921ffddf1c6ad6c48f
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./docker/observability/loki.yaml:/etc/loki/loki.yaml:ro
    tmpfs:
      - /loki:mode=1777,size=512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    restart: unless-stopped

  # Alloy discovers the api container through the Docker API. The socket is mounted read-only, but Docker does not
  # enforce read-only on socket calls, so treat this container as privileged on a local workstation only.
  alloy:
    image: grafana/alloy:v1.5.1@sha256:01a63f4e032ce54ee94b22049bc27f597e74f85566478c377f4b5c7f020c1eb3
    command: ["run", "--storage.path=/tmp/alloy", "/etc/alloy/config.alloy"]
    user: "0:0"
    volumes:
      - ./docker/observability/alloy.config:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs:
      - /tmp/alloy:mode=1777,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    depends_on: [loki]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0@sha256:6559acbd5d770b15bb3c954629ce190ac3cbbdb2b7f1c30f0385c4e05104e218
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./docker/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./docker/observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro
    ports:
      - "127.0.0.1:9090:9090"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    restart: unless-stopped

  # Local Alertmanager (OAV-02, decision D2). Image pinned by digest alone (the digest, not a tag, governs what runs): the
  # official prom/ namespace, pulled as `latest` on 2026-11-06, Alertmanager 0.34.2 (revision e8349048265c, built and
  # image created 2026-10-29). Gossip clustering is off. /alertmanager is the only writable path and is ephemeral (silences and notification log vanish on recreate).
  alertmanager:
    image: prom/alertmanager@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=:9093
      - --cluster.listen-address=
    volumes:
      - ./docker/observability/alertmanager.yaml:/etc/alertmanager/alertmanager.yml:ro
    tmpfs:
      - /alertmanager:mode=1777,size=16m
    ports:
      - "127.0.0.1:9093:9093"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    mem_limit: 64m
    depends_on: [alert-sink]
    restart: unless-stopped

  # Local alert sink (decision D4a): the pinned collector image logs each webhook it receives. No published port; only
  # Alertmanager reaches it over the compose network. Verified by one user-run drill on 2026-11-06 (see alert-sink.yaml).
  alert-sink:
    image: otel/opentelemetry-collector-contrib:0.116.1@sha256:d0ebf65280da2e1b1491d1b93648281afd353d4b9ea19160090303cec9a233bd
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./docker/observability/alert-sink.yaml:/etc/otelcol/config.yaml:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

  # Alert rule tests (OAV-01): promtool from the pinned Prometheus image, run on demand by scripts/check-alert-rules.sh.
  # Profile alert-tests keeps it out of the normal stack. No network, read-only rules and tests, nothing persisted.
  alert-rules:
    image: prom/prometheus:v3.1.0@sha256:6559acbd5d770b15bb3c954629ce190ac3cbbdb2b7f1c30f0385c4e05104e218
    profiles: [alert-tests]
    entrypoint: ["promtool"]
    working_dir: /rules
    volumes:
      - ./docker/observability/alerts.yaml:/rules/alerts.yaml:ro
      - ./docker/observability/alerts.test.yaml:/rules/alerts.test.yaml:ro
    network_mode: none
    tmpfs:
      - /tmp:mode=1777,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    mem_limit: 256m
    restart: "no"

  grafana:
    image: grafana/grafana:11.4.0@sha256:d8ea37798ccc41061a62ab080f2676dda6bf7815558499f901bdb0f533a456fb
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus, tempo, loki]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    restart: unless-stopped
